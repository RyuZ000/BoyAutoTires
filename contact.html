<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ติดต่อ BoyAutoTires โทร 081-160-0060 LINE หรือ Messenger พร้อมแผนที่ร้าน ถ.กาญจนาภิเษก บางใหญ่ นนทบุรี เปิดทุกวัน 08:30–19:00">
    <link rel="canonical" href="https://boyautotires.com/contact">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BoyAutoTires">
    <meta property="og:locale" content="th_TH">
    <meta property="og:url" content="https://boyautotires.com/contact">
    <meta property="og:title" content="ติดต่อเรา (Contact Us) - BoyAutoTires">
    <meta property="og:description" content="ติดต่อ BoyAutoTires โทร 081-160-0060 LINE หรือ Messenger พร้อมแผนที่ร้าน ถ.กาญจนาภิเษก บางใหญ่ นนทบุรี เปิดทุกวัน 08:30–19:00">
    <meta property="og:image" content="https://boyautotires.com/Photo%20Somza/Somza1.jpg">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoPartsStore",
      "name": "BoyAutoTires",
      "url": "https://boyautotires.com/",
      "image": "https://boyautotires.com/Photo%20Somza/Somza1.jpg",
      "telephone": "+66811600060",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "9, 32 Kanchanaphisek Rd",
        "addressLocality": "Bang Yai",
        "addressRegion": "Nonthaburi",
        "postalCode": "11140",
        "addressCountry": "TH"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 13.841615,
        "longitude": 100.41255
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "08:30",
          "closes": "19:00"
        }
      ],
      "sameAs": [
        "https://www.facebook.com/BOYAUTOTIRES",
        "https://www.instagram.com/boyautotires",
        "https://www.tiktok.com/@boyautotires",
        "https://www.youtube.com/@BoyAutoTires"
      ]
    }
    </script>
    <title>ติดต่อเรา (Contact Us) - BoyAutoTires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="contact">
    <div id="site-header"></div>

    <section class="page-hero">
        <div class="container">
            <div class="breadcrumb"><a href="/" data-i18n="nav_home">หน้าแรก</a> / <span data-i18n="menu_contact">ติดต่อเรา</span></div>
            <h1 class="page-title" data-i18n="menu_contact">ติดต่อเรา</h1>
            <p class="page-sub" data-i18n="contact_sub">โทร แชท หรือแวะมาที่ร้านได้เลย ยินดีให้คำปรึกษา</p>
        </div>
    </section>

    <main class="container contact-page">
        <div class="contact-cards" id="contact-cards"></div>

        <section class="contact-map">
            <h2 data-i18n="contact_map">แผนที่</h2>
            <iframe id="contact-map" title="Google Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/store-status.js"></script>
    <script>
        // everything comes from SITE_CONTACT / SITE_SOCIAL in js/layout.js
        // and STORE_HOURS in js/store-status.js
        const c = SITE_CONTACT;
        const q = encodeURIComponent(c.mapQuery);
        const directionsUrl = `https://www.google.com/maps/dir/?api=1&destination=${q}`;
        document.getElementById('contact-map').src = `https://www.google.com/maps?q=${q}&output=embed`;

        function renderContactCards() {
            const cards = [
                {
                    icon: '📞', title: t('contact_phone'),
                    body: `<a href="tel:${c.phoneTel}">${c.phone}</a><a href="tel:${c.phone2Tel}">${c.phone2}</a>`,
                },
                {
                    icon: '📍', title: t('contact_location'),
                    body: `${c.address ? `<p>${c.address[getLang()] || c.address.th}</p>` : ''}
                           <a href="${directionsUrl}" target="_blank" rel="noopener" class="contact-btn gold">${t('contact_directions')}</a>
                           <a href="${c.reviews}" target="_blank" rel="noopener" class="contact-btn outline">${t('contact_reviews')}</a>`,
                },
                {
                    icon: '💬', title: t('contact_chat'),
                    body: `<a href="${c.line}" target="_blank" rel="noopener" class="contact-btn line">${t('contact_line')}</a>
                           <a href="${c.messenger}" target="_blank" rel="noopener" class="contact-btn messenger">${t('contact_messenger')}</a>`,
                },
                {
                    icon: '🕒', title: t('contact_hours'),
                    body: `<span class="store-badge" id="store-badge"></span>
                           <p class="contact-hours">${storeHoursText()}</p>`,
                },
                {
                    icon: '🌐', title: t('contact_social'),
                    body: `<div class="contact-social">${SITE_SOCIAL.map(s =>
                        `<a href="${s.href}" target="_blank" rel="noopener" title="${s.title}"><img src="${s.img}" alt="${s.title}"></a>`
                    ).join('')}</div>`,
                },
            ].filter(Boolean);

            document.getElementById('contact-cards').innerHTML = cards.map(card => `
                <div class="contact-card">
                    <div class="contact-icon">${card.icon}</div>
                    <h3>${card.title}</h3>
                    <div class="contact-body">${card.body}</div>
                </div>`).join('');
            renderStoreBadge();
        }

        // open/closed badge: follows the clock, unless staff overrode it for today
        let storeSetting = null;
        function renderStoreBadge() {
            const badge = document.getElementById('store-badge');
            if (!badge) return;
            const status = getStoreStatus(storeSetting);
            badge.className = 'store-badge ' + (status.open ? 'open' : 'closed');
            badge.textContent = t(status.open ? 'store_open_now' : 'store_closed_now');
        }
        async function refreshStoreStatus() {
            storeSetting = await fetchStoreSetting();
            renderStoreBadge();
        }

        window.onLanguageChange = renderContactCards;
        document.addEventListener('DOMContentLoaded', () => {
            renderContactCards();
            refreshStoreStatus();
            // re-check every minute so the badge flips at opening/closing time
            // and picks up a change made in the admin page
            setInterval(refreshStoreStatus, 60 * 1000);
        });
    </script>
</body>
</html>
