<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoyAutoTires</title>
    <link rel="stylesheet" href="main.css">
    <style>
        /* layout basics and prevent iOS font scaling */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
        body { background-color: black; margin: 0; padding: 0; }
        img, video { max-width: 100%; height: auto; display: block; }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 30px 0;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.25);
        }
        /* keep a consistent ratio and responsive height */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 200px;
            background: #000; /* fallback background so empty areas look good */
        }
        .carousel-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* show whole image without cropping */
            object-position: center center; /* center the image */
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            background: #000;
        }
        .carousel-img.active {
            opacity: 1;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 215, 0, 0.9);
            color: black;
            border: none;
            padding: 12px 16px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            z-index: 10;
            opacity: 0.95;
        }
        .carousel-btn:hover {
            background: rgba(255, 215, 0, 1);
            transform: translateY(-50%) scale(1.05);
        }
        .carousel-btn-prev { left: 12px; }
        .carousel-btn-next { right: 12px; }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease;
        }
        .dot.active {
            background: #ffd700;
            transform: scale(1.3);
        }
        .dot:hover { background: rgba(255, 255, 255, 0.85); }
        /* responsive header/nav and title */
        .nav-container { background-color: goldenrod; display:flex; justify-content:center; gap: clamp(8px, 6vw, 50px); padding:12px; align-items:center; flex-wrap:wrap; }
        /* smaller desktop font while keeping responsive scaling */
        .nav-container a { color: black; padding: 6px 12px; font-size: clamp(11px, 1.2vw, 14px); text-decoration:none; font-weight:700; }
        .site-title { text-align:center; font-size: clamp(28px, 10vw, 100px); color: #ffd700; margin-bottom: 30px; line-height:1; }
        .site-title span { display:inline-block; }
        .video-wrapper { background: rgba(0,0,0,0.4); width: 100%; margin-top: 30px; padding: 20px 0; display: flex; justify-content: center; align-items: center; }
        .video-wrapper .responsive-video { max-width: 900px; width: 90%; border-radius: 8px; box-shadow: 0 8px 32px rgba(255, 215, 0, 0.25); }
        
        /* mobile responsive: keep horizontal but adjust sizing */
        @media (max-width: 768px) {
            .nav-container {
                gap: clamp(4px, 3vw, 20px);
                padding: 8px;
                flex-wrap: wrap;
            }
            .nav-container a {
                font-size: clamp(12px, 3.5vw, 18px);
                padding: 8px 12px;
            }
            .site-title {
                font-size: clamp(24px, 8vw, 60px);
                margin-bottom: 20px;
            }
            .carousel-container {
                width: 95%;
                margin: 20px auto;
            }
            .carousel-btn {
                padding: 10px 12px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-container a {
                font-size: 12px;
                padding: 6px 10px;
            }
            .site-title {
                font-size: 20px;
            }
            .carousel-container {
                width: 98%;
                margin: 15px auto;
            }
        }
    </style>
</head>
<body>
        <nav class="nav-container">
            <a href="alloywheel.html">Alloy Wheels</a>
            <a href="tires.html">Tires</a>
            <a href="shock.html">Shock Absorbers</a>
            <a href="brake.html">Brake System</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
        <h1 class="site-title"><span style="color: yellow;">B</span><span style="color: white;">oyAuto</span><span style="color: gold;">Tires</span></h1>
        
        <div class="carousel-container">
            <div class="carousel-wrapper">
                <img src="Photo Somza/Somza1.jpg" alt="Photo 1" class="carousel-img active">
                <img src="Photo Somza/Somza2.jpg" alt="Photo 2" class="carousel-img">
                <img src="Photo Somza/Somza3.jpg" alt="Photo 3" class="carousel-img">
                <img src="Photo Somza/Somza4.jpg" alt="Photo 4" class="carousel-img">
                <img src="Photo Somza/Somza5.jpg" alt="Photo 5" class="carousel-img">
                <img src="Photo Somza/Somza6.jpg" alt="Photo 6" class="carousel-img">
                <img src="Photo Somza/Somza7.jpg" alt="Photo 7" class="carousel-img">
                <img src="Photo Somza/Somza8.jpg" alt="Photo 8" class="carousel-img">
                <img src="Photo Somza/Somza9.jpg" alt="Photo 9" class="carousel-img">
            </div>
            <button class="carousel-btn carousel-btn-prev" onclick="prevSlide()">❮</button>
            <button class="carousel-btn carousel-btn-next" onclick="nextSlide()">❯</button>
            <div class="carousel-dots">
                <span class="dot active" onclick="goToSlide(0)"></span>
                <span class="dot" onclick="goToSlide(1)"></span>
                <span class="dot" onclick="goToSlide(2)"></span>
                <span class="dot" onclick="goToSlide(3)"></span>
                <span class="dot" onclick="goToSlide(4)"></span>
                <span class="dot" onclick="goToSlide(5)"></span>
                <span class="dot" onclick="goToSlide(6)"></span>
                <span class="dot" onclick="goToSlide(7)"></span>
                <span class="dot" onclick="goToSlide(8)"></span>
            </div>
        </div>

        <div class="video-wrapper">
            <video class="responsive-video" controls autoplay muted loop>
                <source src="Video Somza/Somza1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-img');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = slides.length;

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            slides[n].classList.add('active');
            dots[n].classList.add('active');
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        function goToSlide(n) {
            currentSlide = n;
            showSlide(currentSlide);
        }

        // Auto-play carousel (เล่นอัตโนมัติทุก 5 วินาที)
        setInterval(nextSlide, 5000);
    </script>
    <script src="script.js"></script>
</body>
</html>
