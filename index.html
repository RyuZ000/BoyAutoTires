<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoyAutoTires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/site.css">
    <style>
        /* ---------------- Hero ---------------- */
        .hero {
            position: relative;
            min-height: clamp(460px, 78vh, 720px);
            display: flex;
            align-items: center;
            overflow: hidden;
            background: #000;
        }
        .hero-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .hero-slide.active { opacity: 1; }
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(5,8,16,0.92) 0%, rgba(5,8,16,0.65) 45%, rgba(5,8,16,0.15) 100%);
        }
        .hero-content { position: relative; z-index: 2; padding: 60px 16px; }
        .hero-kicker {
            display: inline-block;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .hero h1 {
            font-size: clamp(26px, 6vw, 60px);
            line-height: 1.15;
            margin: 0 0 16px;
            max-width: 820px;
            font-weight: 800;
        }
        .hero p { color: #cfdcf3; font-size: clamp(15px, 2vw, 18px); max-width: 540px; margin: 0 0 28px; }
        .hero-search {
            display: flex;
            max-width: 520px;
            background: #fff;
            border-radius: 999px;
            padding: 5px;
            margin-bottom: 20px;
        }
        .hero-search input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 12px 18px;
            font-size: 15px;
            font-family: inherit;
            border-radius: 999px;
            color: #111;
        }
        .hero-search button {
            border: none;
            background: var(--blue);
            color: #fff;
            font-weight: 700;
            font-family: inherit;
            padding: 0 26px;
            border-radius: 999px;
            cursor: pointer;
        }
        .hero-search button:hover { background: #1f5fcf; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-gold { background: var(--gold); color: #111; }
        .btn-line { background: #06c755; color: #fff; }
        .btn-outline { border: 1px solid var(--line); color: var(--text); }
        .hero-dots {
            position: absolute;
            z-index: 3;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        .hero-dots button {
            width: 10px; height: 10px;
            border-radius: 999px;
            border: none;
            padding: 0;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: width .3s, background .3s;
        }
        .hero-dots button.active { width: 28px; background: var(--gold); }

        /* ---------------- Sections ---------------- */
        .section { padding: 64px 0 0; }
        .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }
        .section-head h2 { margin: 0; font-size: clamp(24px, 3.5vw, 32px); font-weight: 800; }
        .section-head p { margin: 4px 0 0; color: var(--muted); }
        .section-head a { color: var(--blue-soft); text-decoration: none; font-weight: 600; white-space: nowrap; }

        /* category cards */
        .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        .cat-card {
            position: relative;
            display: block;
            aspect-ratio: 3 / 4;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            border: 1px solid var(--line);
            background: var(--panel);
        }
        .cat-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform .5s ease;
        }
        .cat-card:hover img { transform: scale(1.06); }
        .cat-card .cat-info {
            position: absolute;
            inset: auto 0 0 0;
            padding: 18px;
            background: linear-gradient(0deg, rgba(5,8,16,0.95) 0%, rgba(5,8,16,0) 100%);
        }
        .cat-card h3 { margin: 0 0 4px; font-size: 22px; color: #fff; }
        .cat-card p { margin: 0 0 10px; font-size: 13px; color: #cfdcf3; }
        .cat-card span { color: var(--gold); font-weight: 600; font-size: 14px; }

        /* why us */
        .why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
        .why-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px;
        }
        .why-icon {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px;
            background: rgba(245, 197, 24, 0.12);
            font-size: 26px;
            margin-bottom: 14px;
        }
        .why-card h3 { margin: 0 0 6px; font-size: 18px; }
        .why-card p { margin: 0; color: var(--muted); font-size: 14px; }

        /* latest products reuse .products-grid from staff.css */
        #latest-grid { margin: 0; padding: 0; max-width: none; }

        /* gallery */
        .gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-auto-rows: 200px; gap: 12px; }
        .gallery video, .gallery img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 14px;
            display: block;
        }
        .gallery .g-main { grid-row: span 2; }

        /* CTA band */
        .cta-band {
            margin-top: 64px;
            border-radius: 20px;
            padding: 36px;
            background: linear-gradient(120deg, #0b3d91 0%, #1f5fcf 60%, #2f7cff 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }
        .cta-band h2 { margin: 0 0 4px; font-size: clamp(22px, 3vw, 28px); }
        .cta-band p { margin: 0; color: #dbe8ff; }

        @media (max-width: 900px) {
            .cat-grid, .why-grid { grid-template-columns: repeat(2, 1fr); }
            .gallery { grid-template-columns: 1fr 1fr; grid-auto-rows: 160px; }
            .gallery .g-main { grid-column: span 2; grid-row: span 2; }
        }
        @media (max-width: 480px) {
            .cat-grid { gap: 12px; }
            .cat-card h3 { font-size: 18px; }
            .cat-card p { display: none; }
            .why-grid { grid-template-columns: 1fr; }
            .cta-band { padding: 24px; }
            .hero-search button { padding: 0 18px; }
        }
    </style>
</head>
<body data-page="home">
    <div id="site-header"></div>

    <!-- Hero with photo slideshow -->
    <section class="hero">
        <img src="Photo Somza/Somza1.jpg" alt="" class="hero-slide active">
        <img src="Photo Somza/Somza5.jpg" alt="" class="hero-slide" loading="lazy">
        <img src="Photo Somza/Somza6.jpg" alt="" class="hero-slide" loading="lazy">
        <img src="Photo Somza/Somza8.jpg" alt="" class="hero-slide" loading="lazy">
        <div class="container hero-content">
            <span class="hero-kicker" data-i18n="hero_kicker">ล้อแม็ก · ยาง · โช้คอัพ · เบรก</span>
            <h1 data-i18n="hero_title">ศูนย์รวมช่วงล่างครบวงจร</h1>
            <p data-i18n="hero_sub"></p>
            <form class="hero-search" onsubmit="heroSearch(event)">
                <input type="text" id="hero-q" data-i18n-placeholder="hero_search_placeholder" placeholder="ค้นหาไซส์ยาง">
                <button type="submit" data-i18n="hero_search_btn">ค้นหา</button>
            </form>
            <div class="hero-actions">
                <a href="tel:+66811600060" class="btn btn-gold" data-i18n="cta_call">📞 โทรเลย</a>
                <a href="https://line.me/ti/p/@boyautotires" target="_blank" rel="noopener" class="btn btn-line" data-i18n="cta_line">💬 แอด LINE</a>
            </div>
        </div>
        <div class="hero-dots" id="hero-dots"></div>
    </section>

    <main class="container">
        <!-- Categories -->
        <section class="section">
            <div class="section-head">
                <div>
                    <h2 data-i18n="section_categories">หมวดหมู่สินค้า</h2>
                    <p data-i18n="section_categories_sub"></p>
                </div>
            </div>
            <div class="cat-grid">
                <a href="alloywheel.html" class="cat-card">
                    <img src="Photo Somza/Somza5.jpg" alt="" data-cat="wheels" loading="lazy">
                    <div class="cat-info"><h3 data-i18n="nav_wheels">ล้อแม็ก</h3><p data-i18n="cat_wheels_desc"></p><span data-i18n="cat_view"></span></div>
                </a>
                <a href="tires.html" class="cat-card">
                    <img src="Photo Somza/Somza2.jpg" alt="" data-cat="tires" loading="lazy">
                    <div class="cat-info"><h3 data-i18n="nav_tires">ยาง</h3><p data-i18n="cat_tires_desc"></p><span data-i18n="cat_view"></span></div>
                </a>
                <a href="shock.html" class="cat-card">
                    <img src="Photo Somza/Somza3.jpg" alt="" data-cat="shock" loading="lazy">
                    <div class="cat-info"><h3 data-i18n="nav_shock">โช้คอัพ</h3><p data-i18n="cat_shock_desc"></p><span data-i18n="cat_view"></span></div>
                </a>
                <a href="brake.html" class="cat-card">
                    <img src="Photo Somza/Somza4.jpg" alt="" data-cat="brake" loading="lazy">
                    <div class="cat-info"><h3 data-i18n="nav_brake">เบรก</h3><p data-i18n="cat_brake_desc"></p><span data-i18n="cat_view"></span></div>

            </div>
        </section>

        <!-- Latest products from Supabase -->
        <section class="section" id="latest-section">
            <div class="section-head">
                <h2 data-i18n="section_latest">สินค้ามาใหม่</h2>
            </div>
            <div class="products-grid" id="latest-grid"></div>
        </section>

        <!-- Why us -->
        <section class="section">
            <div class="section-head"><h2 data-i18n="section_why">ทำไมต้อง BoyAutoTires</h2></div>
            <div class="why-grid">
                <div class="why-card"><div class="why-icon">🔧</div><h3 data-i18n="why_1_title"></h3><p data-i18n="why_1_desc"></p></div>
                <div class="why-card"><div class="why-icon">🛞</div><h3 data-i18n="why_2_title"></h3><p data-i18n="why_2_desc"></p></div>
                <div class="why-card"><div class="why-icon">💬</div><h3 data-i18n="why_3_title"></h3><p data-i18n="why_3_desc"></p></div>
                <div class="why-card"><div class="why-icon">📱</div><h3 data-i18n="why_4_title"></h3><p data-i18n="why_4_desc"></p></div>
            </div>
        </section>

        <!-- Gallery -->
        <section class="section">
            <div class="section-head"><h2 data-i18n="section_gallery">ผลงานของเรา</h2></div>
            <div class="gallery">
                <video class="g-main" autoplay muted loop playsinline controls>
                    <source src="Video Somza/Somza1.mp4" type="video/mp4">
                </video>
                <img src="Photo Somza/Somza6.jpg" alt="" loading="lazy">
                <img src="Photo Somza/Somza7.jpg" alt="" loading="lazy">
                <img src="Photo Somza/Somza8.jpg" alt="" loading="lazy">
                <img src="Photo Somza/Somza9.jpg" alt="" loading="lazy">
            </div>
        </section>

        <!-- Contact CTA -->
        <section class="cta-band">
            <div>
                <h2 data-i18n="cta_band_title">สนใจสินค้าหรือต้องการสอบถาม?</h2>
                <p data-i18n="cta_band_sub"></p>
            </div>
            <div class="hero-actions">
                <a href="tel:+66811600060" class="btn btn-gold" data-i18n="cta_call">📞 โทรเลย</a>
                <a href="https://line.me/ti/p/@boyautotires" target="_blank" rel="noopener" class="btn btn-line" data-i18n="cta_line">💬 แอด LINE</a>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/products.js"></script>
    <script>
        // hero slideshow
        const heroSlides = document.querySelectorAll('.hero-slide');
        const heroDots = document.getElementById('hero-dots');
        let heroIndex = 0;
        heroSlides.forEach((_, i) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.setAttribute('aria-label', 'Slide ' + (i + 1));
            b.onclick = () => showHero(i);
            heroDots.appendChild(b);
        });
        function showHero(i) {
            heroIndex = i;
            heroSlides.forEach((s, j) => s.classList.toggle('active', j === i));
            heroDots.querySelectorAll('button').forEach((d, j) => d.classList.toggle('active', j === i));
        }
        showHero(0);
        setInterval(() => showHero((heroIndex + 1) % heroSlides.length), 5000);

        // hero search -> tires page with ?q=
        function heroSearch(e) {
            e.preventDefault();
            const q = document.getElementById('hero-q').value.trim();
            location.href = 'tires.html' + (q ? '?q=' + encodeURIComponent(q) : '');
        }

        // newest products across all categories
        let latestProducts = [];
        async function loadLatest() {
            const grid = document.getElementById('latest-grid');
            grid.innerHTML = `<p class="products-status">${t('products_loading')}</p>`;
            const { data, error } = await sb
                .from('products')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(8);
            if (error) {
                console.error('loadLatest error:', error);
                document.getElementById('latest-section').style.display = 'none';
                return;
            }
            latestProducts = data || [];
            if (!latestProducts.length) {
                document.getElementById('latest-section').style.display = 'none';
                return;
            }
            renderProductCards(latestProducts, 'latest-grid');
            useProductImagesForCategories(latestProducts);
        }

        // swap category card photos for a real product photo when one exists
        function useProductImagesForCategories(products) {
            document.querySelectorAll('.cat-card img[data-cat]').forEach(img => {
                const p = products.find(p => p.category === img.dataset.cat && getProductImages(p).length);
                if (p) img.src = getProductImages(p)[0];
            });
        }

        function onLanguageChange() {
            if (latestProducts.length) renderProductCards(latestProducts, 'latest-grid');
        }

        document.addEventListener('DOMContentLoaded', loadLatest);
    </script>
</body>
</html>
