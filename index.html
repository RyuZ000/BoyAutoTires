    <style>
        /* layout basics and prevent iOS font scaling */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
        body { background-color: black; margin: 0; padding: 0; }
        img { max-width: 100%; height: auto; }
        img.carousel-img, video { display: block; }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 30px 0;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.25);
        }
        /* keep a consistent ratio and responsive height */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 200px;
            background: #000; /* fallback background so empty areas look good */
        }
        .carousel-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* show whole image without cropping */
            object-position: center center; /* center the image */
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            background: #000;
        }
        .carousel-img.active {
            opacity: 1;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 215, 0, 0.9);
            color: black;
            border: none;
            padding: 12px 16px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            z-index: 10;
            opacity: 0.95;
        }
        .carousel-btn:hover {
            background: rgba(255, 215, 0, 1);
            transform: translateY(-50%) scale(1.05);
        }
        .carousel-btn-prev { left: 12px; }
        .carousel-btn-next { right: 12px; }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease;
        }
        .dot.active {
            background: #ffd700;
            transform: scale(1.3);
        }
        .dot:hover { background: rgba(255, 255, 255, 0.85); }
        /* responsive header/nav and title */
        .nav-container { background-color: goldenrod; display:flex; justify-content:center; gap: clamp(8px, 6vw, 50px); padding:12px; align-items:center; flex-wrap:wrap; }
        /* smaller desktop font while keeping responsive scaling */
        .nav-container a { color: black; padding: 6px 12px; font-size: clamp(18px, 1.3vw, 30px); text-decoration:none; font-weight:700; }
        .site-title { text-align:center; font-size: clamp(28px, 10vw, 100px); color: hsl(51, 100%, 50%); margin-bottom: 30px; line-height:1; }
        .site-title span { display:inline-block; }
        .outsite-title { text-align: center; font-size: clamp(20px, 1.8vw, 40px); color: white; margin-top: 0; margin-bottom: 30px; line-height: 1.2; }
        .outsite-title span { display:inline-block; }
        .video-wrapper { background: rgba(0,0,0,0.4); width: 100%; margin-top: 30px; padding: 20px 0; display: flex; justify-content: center; align-items: center; }
        .video-wrapper .responsive-video { max-width: 900px; width: 90%; border-radius: 8px; box-shadow: 0 8px 32px rgba(255, 215, 0, 0.25); }

        /* social nav: same style as nav-container - horizontal all devices */
        .social-nav { background-color: goldenrod; display: flex; justify-content: center; gap: 16px; padding: 12px; align-items: center; flex-wrap: wrap; margin-top: 20px; flex-direction: row; }
        .social-nav a { display: flex; align-items: center; gap: 6px; text-decoration: none; color: inherit; flex-direction: row; }
        .social-nav img { width: 40px; height: 40px; }
        .social-nav .label { color: black; font-size: 16px; font-weight: 700; }

        /* Mobile (iPhone, Android, iPad) */
        @media (max-width: 768px) {
            .social-nav { gap: 12px; padding: 10px; margin-top: 15px; }
            .social-nav img { width: 32px; height: 32px; }
            .social-nav .label { font-size: 12px; }
        }

        /* Desktop (PC, Notebook, Mac) */
        @media (min-width: 769px) {
            .social-nav { gap: 20px; padding: 14px; margin-top: 20px; }
            .social-nav img { width: 44px; height: 44px; }
            .social-nav .label { font-size: 18px; }
        }        
        /* mobile responsive: keep horizontal but adjust sizing */
        @media (max-width: 768px) {
            .nav-container {    
                gap: clamp(4px, 3vw, 20px);
                padding: 8px;
                flex-wrap: wrap;
            }
            .nav-container a {
                font-size: clamp(12px, 3.5vw, 18px);
                padding: 8px 12px;
            }
            .site-title {
                font-size: clamp(24px, 8vw, 60px);
                margin-bottom: 20px;
            }
            .outsite-title {
                font-size: clamp(14px, 2.0vw, 18px);
                margin-top: 0;
            }
            .carousel-container {
                width: 95%;
                margin: 20px auto;
            }
            .carousel-btn {
                padding: 10px 12px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-container a {
                font-size: 12px;
                padding: 6px 10px;
            }
            .site-title {
                font-size: clamp(24px, 8vw, 60px);
                margin-bottom: 20px;
            }
            .outsite-title {
                font-size: clamp(14px, 2.0vw, 18px);
                margin-top: 0;
            }
            .carousel-container {
                width: 98%;
                margin: 15px auto;
            }
        }
        /* tablet (iPad) portrait — add extra spacing between title and tagline */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .site-title { margin-bottom: 15px; }
            .outsite-title { margin-top: -5px; }
        }        /* tablet (iPad) landscape — add spacing */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
            .site-title { margin-bottom: 25px; }
            .outsite-title { margin-top: 0px; }
        }    </style>
</head>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-img');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = slides.length;

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            slides[n].classList.add('active');
            dots[n].classList.add('active');
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        function goToSlide(n) {
            currentSlide = n;
            showSlide(currentSlide);
        }

        // Auto-play carousel (เล่นอัตโนมัติทุก 5 วินาที)
        setInterval(nextSlide, 5000);
    </script>
