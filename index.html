    <style>
        /* layout basics and prevent iOS font scaling */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
        body { 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            margin: 0; 
            padding: 15px; 
            min-height: 100vh;
        }
        img { max-width: 100%; height: auto; }
        img.carousel-img, video { display: block; }

        .carousel-container {
            position: relative;
            width: 90%;
            max-width: 1100px;
            margin: 25px auto;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7) 0%, rgba(20, 20, 20, 0.9) 100%);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.2), 0 0 40px rgba(255, 215, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        /* keep a consistent ratio and responsive height */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 580px;
            background: #000;
        }
        .carousel-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            background: #000;
        }
        .carousel-img.active {
            opacity: 1;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: black;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 16px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            opacity: 0.8;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.3);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-btn:hover {
            background: linear-gradient(135deg, #ffed4e 0%, #ffd700 100%);
            transform: translateY(-50%) scale(1.2);
            opacity: 1;
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.45), 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .carousel-btn-prev { left: 20px; }
        .carousel-btn-next { right: 20px; }
        .carousel-dots {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 18px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .dot.active {
            background: #ffd700;
            transform: scale(1.5);
            border-color: #ffed4e;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        .dot:hover { background: rgba(255, 255, 255, 0.6); }
        
        /* responsive header/nav and title */
        .nav-container { 
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            display:flex; 
            justify-content:center; 
            gap: 25px;

        .video-wrapper {

            border: 1px solid rgba(255, 215, 0, 0.18);

        /* social nav: same style as nav-container */
        .social-nav { 
            background: linear-gradient(90deg, #ffd700 0%, #ffed4e 50%, #ffd700 100%);
            display: flex; 
            justify-content: center; 
            gap: 18px;

            flex-wrap: wrap;

        .social-nav a { 
            display: flex;

            gap: 8px;

            white-space: nowrap; 
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .social-nav a:hover {

        }
        .social-nav img { width: 32px; height: 32px; }
        .social-nav .label { color: black; font-size: 14px; font-weight: 700; }        
        /* mobile responsive: keep horizontal but adjust sizing */
        @media (max-width: 768px) {
            .nav-container {    
                gap: clamp(4px, 3vw, 20px);
                padding: 8px;
                flex-wrap: wrap;
            }
            .nav-container a {
                font-size: clamp(12px, 3.5vw, 18px);
                padding: 8px 12px;
            }
            .site-title {
                font-size: clamp(24px, 8vw, 60px);
                margin-bottom: 20px;
            }
            .outsite-title {
                font-size: clamp(14px, 2.0vw, 18px);
                margin-top: 0;
            }
            .carousel-container {
                width: 95%;
                margin: 20px auto;
            }
            .carousel-btn {
                padding: 10px 12px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-container a {
                font-size: 12px;
                padding: 6px 10px;
            }
            .site-title {
                font-size: clamp(24px, 8vw, 60px);
                margin-bottom: 20px;
            }
            .outsite-title {
                font-size: clamp(14px, 2.0vw, 18px);
                margin-top: 0;
            }
            .carousel-container {
                width: 98%;
                margin: 15px auto;
            }
        }
        /* tablet (iPad) portrait — add extra spacing between title and tagline */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .site-title { margin-bottom: 15px; }
            .outsite-title { margin-top: -5px; }
        }        /* tablet (iPad) landscape — add spacing */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: landscape) {
            .site-title { margin-bottom: 25px; }
            .outsite-title { margin-top: 0px; }
        }    </style>
</head>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-img');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = slides.length;

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            slides[n].classList.add('active');
            dots[n].classList.add('active');
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        function goToSlide(n) {
            currentSlide = n;
            showSlide(currentSlide);
        }

        // Auto-play carousel (เล่นอัตโนมัติทุก 5 วินาที)
        setInterval(nextSlide, 5000);
    </script>
