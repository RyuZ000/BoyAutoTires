<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ผลงานติดตั้งล้อแม็ก ยาง และช่วงล่างจากรถลูกค้าจริงของร้าน BoyAutoTires">
    <link rel="canonical" href="https://boyautotires.com/portfolio">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BoyAutoTires">
    <meta property="og:locale" content="th_TH">
    <meta property="og:url" content="https://boyautotires.com/portfolio">
    <meta property="og:title" content="ผลงาน (Portfolio) - BoyAutoTires">
    <meta property="og:description" content="ผลงานติดตั้งล้อแม็ก ยาง และช่วงล่างจากรถลูกค้าจริงของร้าน BoyAutoTires">
    <meta property="og:image" content="https://boyautotires.com/Photo%20Somza/Somza1.jpg">
    <title>ผลงาน (Portfolio) - BoyAutoTires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="portfolio">
    <div id="site-header"></div>

    <section class="page-hero">
        <div class="container">
            <div class="breadcrumb"><a href="/" data-i18n="nav_home">หน้าแรก</a> / <span data-i18n="nav_portfolio">ผลงาน</span></div>
            <h1 class="page-title" data-i18n="page_title_portfolio">ผลงานของเรา</h1>
            <p class="page-sub" data-i18n="portfolio_sub">รูปและวิดีโองานติดตั้งจริงจากหน้าร้าน</p>
        </div>
    </section>

    <main class="container shop">
        <div class="shop-toolbar">
            <div class="shop-search">
                <input type="search" id="pf-search" data-i18n-placeholder="pf_search" placeholder="ค้นหาชื่อรถ เช่น Revo, Tank 300">
            </div>
        </div>
        <nav class="cat-chips" id="pf-tabs"></nav>
        <div class="pf-grid" id="pf-grid"></div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/search.js"></script>
    <script src="js/portfolio.js"></script>
    <script src="js/products.js"></script>
    <script>
        // portfolio_items rows (added in the admin page), shown as one album per car (js/portfolio.js)
        const PF_TABS = [
            { type: 'all', key: 'pf_tab_all' },
            { type: 'photo', key: 'pf_tab_photo' },
            { type: 'video', key: 'pf_tab_video' },
        ];
        let pfItems = [];
        let pfType = 'all';
        let pfLoaded = false;
        const pfSearch = document.getElementById('pf-search');

        // albums matching the search, each limited to the selected tab's media type
        function visibleAlbums(type) {
            return groupPortfolio(pfItems)
                .filter(a => textMatches(a.name, pfSearch.value))
                .map(a => {
                    const items = type === 'photo' ? a.photos : type === 'video' ? a.videos : a.items;
                    return { ...a, items, cover: items[0] };
                })
                .filter(a => a.items.length);
        }

        function renderPortfolio() {
            document.getElementById('pf-tabs').innerHTML = PF_TABS.map(tab =>
                `<button type="button" class="cat-chip ${tab.type === pfType ? 'active' : ''}" onclick="setPfType('${tab.type}')">${t(tab.key)} <span class="pf-count">${visibleAlbums(tab.type).length}</span></button>`
            ).join('');

            const grid = document.getElementById('pf-grid');
            if (!pfLoaded) {
                grid.innerHTML = `<p class="products-status">${t('products_loading')}</p>`;
                return;
            }
            const albums = visibleAlbums(pfType);
            if (!albums.length) {
                grid.innerHTML = `<p class="products-status">${t(pfItems.length ? 'pf_no_match' : 'pf_empty')}</p>`;
                return;
            }

            grid.innerHTML = albums.map((a, n) => {
                const name = a.name || t('pf_no_name');
                // the lightbox (js/products.js) pages through the album's photos and videos
                galleryData['pf' + n] = {
                    name,
                    images: a.items.map(i => i.url),
                    types: a.items.map(i => i.media_type),
                };
                const photos = a.items.filter(i => i.media_type === 'photo').length;
                const videos = a.items.length - photos;
                const cover = a.cover.media_type === 'video'
                    ? `<video src="${escapeHtml(a.cover.url)}#t=0.1" muted playsinline preload="metadata"></video><span class="pf-play">▶</span>`
                    : `<img src="${escapeHtml(a.cover.url)}" alt="${escapeHtml(name)}" loading="lazy">`;
                return `<figure class="pf-card">
                    <button type="button" class="pf-photo" onclick="openLightbox('pf${n}')" aria-label="${escapeHtml(name)}">
                        ${cover}
                        <span class="pf-badges">
                            ${photos ? `<span>📷 ${photos}</span>` : ''}
                            ${videos ? `<span>🎬 ${videos}</span>` : ''}
                        </span>
                    </button>
                    <figcaption class="pf-caption">${escapeHtml(name)}</figcaption>
                </figure>`;
            }).join('');
        }

        function setPfType(type) {
            pfType = type;
            renderPortfolio();
        }

        async function loadPortfolio() {
            renderPortfolio();
            const { data, error } = await sb
                .from('portfolio_items')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) {
                console.error('loadPortfolio error:', error);
                document.getElementById('pf-grid').innerHTML = `<p class="products-status">${t('products_error')}</p>`;
                return;
            }
            pfItems = data || [];
            pfLoaded = true;
            renderPortfolio();
        }

        pfSearch.addEventListener('input', renderPortfolio);
        window.onLanguageChange = renderPortfolio;
        document.addEventListener('DOMContentLoaded', loadPortfolio);
    </script>
</body>
</html>
