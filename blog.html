<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บทความ (Blog) - BoyAutoTires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="blog">
    <div id="site-header"></div>

    <section class="page-hero">
        <div class="container">
            <div class="breadcrumb"><a href="/" data-i18n="nav_home">หน้าแรก</a> / <span data-i18n="menu_blog"></span></div>
            <h1 class="page-title" data-i18n="menu_blog">บทความ</h1>
            <p class="page-sub" data-i18n="blog_sub"></p>
        </div>
    </section>

    <main class="container">
        <!-- no posts yet: tell people where to follow the shop in the meantime -->
        <section class="blog-empty">
            <div class="blog-empty-icon">📝</div>
            <h2 data-i18n="blog_empty_title"></h2>
            <p data-i18n="blog_empty_desc"></p>
            <div class="contact-social" id="blog-social"></div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        document.getElementById('blog-social').innerHTML = SITE_SOCIAL.map(s =>
            `<a href="${s.href}" target="_blank" rel="noopener" title="${s.title}"><img src="${s.img}" alt="${s.title}"></a>`
        ).join('');
    </script>
</body>
</html>
