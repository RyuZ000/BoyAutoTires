    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            margin: 0;
            padding: 0 0 40px;
            min-height: 100vh;
            font-family: Arial, sans-serif;

        .nav-container {

        .nav-container a {
            color: black;
            padding: 10px 20px;

            text-decoration:none;

            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .nav-container a:hover {
            background: rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }
        .page-title {
            text-align: center;
            font-size: clamp(28px, 6vw, 50px);
            color: #ffd700;
            margin: 35px 0 10px;
            font-weight: 900;
            text-shadow: 0 6px 25px rgba(0,0,0,0.6), 0 0 40px rgba(255,215,0,0.25);
        }
        @media (max-width: 768px) {
            .nav-container { gap: clamp(4px, 3vw, 20px); padding: 8px; }
            .nav-container a { font-size: clamp(12px, 3.5vw, 18px); padding: 8px 12px; }
