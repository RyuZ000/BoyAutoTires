<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยางรถยนต์ (Tires) - BoyAutoTires</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="css/staff.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: linear-gradient(160deg, #0d2a5c 0%, #0a1730 32%, #050810 68%, #020306 100%);
            margin: 0;
            padding: 0 0 40px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .nav-container {
            background: linear-gradient(90deg, #0b3d91 0%, #1f5fcf 45%, #050810 100%);
            display:flex;
            justify-content:center;
            gap: 25px;
            padding: 14px 30px;
            align-items:center;
            flex-wrap:wrap;
            box-shadow: 0 10px 30px rgba(77, 163, 255, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-bottom: 2px solid rgba(0, 0, 0, 0.15);
        }
        .nav-container a {
            color: #eaf3ff;
            padding: 10px 20px;
            font-size: 18px;
            text-decoration:none;
            font-weight:700;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .nav-container a:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }
        .page-title {
            text-align: center;
            font-size: clamp(28px, 6vw, 50px);
            color: #4da3ff;
            margin: 35px 0 10px;
            font-weight: 900;
            text-shadow: 0 6px 25px rgba(0,0,0,0.6), 0 0 40px rgba(77,163,255,0.25);
        }
        @media (max-width: 768px) {
            .nav-container { gap: clamp(4px, 3vw, 20px); padding: 8px; }
            .nav-container a { font-size: clamp(12px, 3.5vw, 18px); padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <div class="lang-switch">
        <button class="lang-btn" data-lang="th" onclick="setLanguage('th')">ไทย</button>
        <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
    </div>
    <div class="staff-corner">
        <a id="staff-login-link" href="admin.html" class="staff-btn" data-i18n="staff_login">🔒 Staff Login</a>
        <a id="staff-admin-link" href="admin.html" class="staff-btn" style="display:none;" data-i18n="staff_admin">🛠 Admin Panel</a>
        <a id="staff-logout-link" href="#" class="staff-btn" style="display:none;" data-i18n="staff_logout" onclick="staffLogout(); return false;">ออกจากระบบ</a>
    </div>

    <nav class="nav-container">
        <a href="index.html" data-i18n="nav_home">หน้าแรก</a>
        <a href="alloywheel.html" data-i18n="nav_wheels">Wheels</a>
        <a href="tires.html" data-i18n="nav_tires">Tires</a>
        <a href="shock.html" data-i18n="nav_shock">Shock Absorbers</a>
        <a href="brake.html" data-i18n="nav_brake">Brake</a>
    </nav>

    <h1 class="page-title" data-i18n="page_title_tires">Loading...</h1>

    <div class="search-sort-bar">
        <input type="text" id="tire-search" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="ค้นหาไซส์ยาง หรือชื่อยาง...">
        <select id="sort-select" class="sort-select" onchange="handleSortChange()">
            <option value="size_asc" data-i18n="sort_size_asc">ไซส์: เล็ก → ใหญ่</option>
            <option value="size_desc" data-i18n="sort_size_desc">ไซส์: ใหญ่ → เล็ก</option>
            <option value="name_asc" data-i18n="sort_name_asc">ชื่อ: ก-ฮ / A-Z</option>
            <option value="name_desc" data-i18n="sort_name_desc">ชื่อ: ฮ-ก / Z-A</option>
            <option value="price_asc" data-i18n="sort_price_asc">ราคา: ถูก → แพง</option>
            <option value="price_desc" data-i18n="sort_price_desc">ราคา: แพง → ถูก</option>
        </select>
    </div>

    <div class="products-grid" id="products-grid"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/products.js"></script>
    <script>
        let allTires = [];
        let sortField = 'size';  // 'size' | 'name' | 'price'
        let sortDir = 1;         // 1 = ascending, -1 = descending

        async function fetchTires() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = `<p class="products-status">${t('products_loading')}</p>`;

            const { data, error } = await sb
                .from('products')
                .select('*')
                .eq('category', 'tires')
                .order('created_at', { ascending: false });

            if (error) {
                grid.innerHTML = `<p class="products-status">${t('products_error')}</p>`;
                console.error('fetchTires error:', error);
                return;
            }

            allTires = data || [];
            renderFiltered();
        }

        function handleSortChange() {
            const value = document.getElementById('sort-select').value; // e.g. "price_desc"
            const [field, dir] = value.split('_');
            sortField = field;
            sortDir = dir === 'desc' ? -1 : 1;
            renderFiltered();
        }

        function renderFiltered() {
            const query = document.getElementById('tire-search').value.trim().toLowerCase();

            let list = allTires.filter(p => {
                const name = (p.name || '').toLowerCase();
                const size = (p.size || '').toLowerCase();
                return !query || name.includes(query) || size.includes(query);
            });

            list = list.slice().sort((a, b) => {
                if (sortField === 'price') {
                    // products with no price set are always pushed to the end
                    const ap = a.price;
                    const bp = b.price;
                    if (ap == null && bp == null) return 0;
                    if (ap == null) return 1;
                    if (bp == null) return -1;
                    return (ap - bp) * sortDir;
                }
                const av = (sortField === 'size' ? a.size : a.name) || '';
                const bv = (sortField === 'size' ? b.size : b.name) || '';
                return av.localeCompare(bv, undefined, { numeric: true, sensitivity: 'base' }) * sortDir;
            });

            if (query && list.length === 0) {
                document.getElementById('products-grid').innerHTML = `<p class="products-status">${t('search_no_results')}</p>`;
                return;
            }

            renderProductCards(list, 'products-grid');
        }

        document.getElementById('tire-search').addEventListener('input', renderFiltered);

        function onLanguageChange() {
            renderFiltered();
        }

        document.addEventListener('DOMContentLoaded', fetchTires);
    </script>
</body>
</html>
