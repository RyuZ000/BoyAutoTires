<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ยางรถยนต์ทุกไซส์ ค้นหาตามไซส์ แบรนด์ และราคา พร้อมเปลี่ยนที่ร้าน BoyAutoTires บางใหญ่ นนทบุรี">
    <link rel="canonical" href="https://boyautotires.com/tires">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BoyAutoTires">
    <meta property="og:locale" content="th_TH">
    <meta property="og:url" content="https://boyautotires.com/tires">
    <meta property="og:title" content="ยางรถยนต์ (Tires) - BoyAutoTires">
    <meta property="og:description" content="ยางรถยนต์ทุกไซส์ ค้นหาตามไซส์ แบรนด์ และราคา พร้อมเปลี่ยนที่ร้าน BoyAutoTires บางใหญ่ นนทบุรี">
    <meta property="og:image" content="https://boyautotires.com/Photo%20Somza/Somza1.jpg">
    <title>ยางรถยนต์ (Tires) - BoyAutoTires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="tires">
    <div id="site-header"></div>

    <section class="page-hero">
        <div class="container">
            <div class="breadcrumb"><a href="/" data-i18n="nav_home">หน้าแรก</a> / <span data-i18n="nav_tires"></span></div>
            <h1 class="page-title" data-i18n="page_title_tires">Loading...</h1>
            <p class="page-sub" data-i18n="cat_tires_desc"></p>
        </div>
    </section>

    <main class="container shop">
        <nav class="cat-chips" id="cat-chips"></nav>
        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="shop-filters" data-i18n="filter_title">คัดกรอง</button>
        <div class="shop-layout">
        <aside class="shop-filters" id="shop-filters">
            <div class="filter-head">
                <h2 data-i18n="filter_title">คัดกรอง</h2>
                <button type="button" class="filter-clear" id="filter-clear" data-i18n="filter_clear">ล้างตัวกรอง</button>
            </div>
            <div class="filter-group">
                <h3 data-i18n="filter_brand">แบรนด์</h3>
                <div id="filter-options"></div>
            </div>
            <div class="filter-group">
                <h3 data-i18n="filter_price">ช่วงราคา (บาท)</h3>
                <div class="price-range">
                    <input type="number" id="price-min" min="0" inputmode="numeric" data-i18n-placeholder="price_min" placeholder="ต่ำสุด">
                    <span>–</span>
                    <input type="number" id="price-max" min="0" inputmode="numeric" data-i18n-placeholder="price_max" placeholder="สูงสุด">
                </div>
            </div>
        </aside>
        <div class="shop-main">
        <div class="shop-toolbar">
            <div class="shop-search">
                <input type="search" id="shop-search" data-i18n-placeholder="search_placeholder" placeholder="พิมพ์ไซส์ยาง เช่น 2656018 หรือชื่อยาง">
            </div>
            <span class="shop-count" id="shop-count"></span>
        </div>
        <div class="products-grid" id="products-grid"></div>
        </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/search.js"></script>
    <script src="js/products.js"></script>
    <script>
        // sidebar: brand + price range (js/products.js), like the wheels page.
        // Tire names start with the brand ("TOYO OPENCOUNTRY H/T2" -> TOYO).
        const brandOf = name => (name || '').trim().split(/\s+/)[0] || '';
        document.addEventListener('DOMContentLoaded', () => initFilteredProductPage('tires', 'size_asc', {
            getOptions: products => {
                const brands = new Map();
                for (const p of products) {
                    const brand = brandOf(p.name);
                    const key = brand.toLowerCase();
                    if (!key) continue;
                    if (!brands.has(key)) brands.set(key, { value: key, label: brand.toUpperCase(), count: 0 });
                    brands.get(key).count++;
                }
                return [...brands.values()].sort((a, b) => a.label.localeCompare(b.label));
            },
            matches: (p, value) => brandOf(p.name).toLowerCase() === value,
        }));
    </script>
</body>
</html>
