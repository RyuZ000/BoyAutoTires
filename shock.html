<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โช้คอัพ (Shock Absorbers) - BoyAutoTires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="shock">
    <div id="site-header"></div>

    <section class="page-hero">
        <div class="container">
            <div class="breadcrumb"><a href="index.html" data-i18n="nav_home">หน้าแรก</a> / <span data-i18n="nav_shock"></span></div>
            <h1 class="page-title" data-i18n="page_title_shock">Loading...</h1>
            <p class="page-sub" data-i18n="cat_shock_desc"></p>
        </div>
    </section>

    <main class="container shop">
        <nav class="cat-chips" id="cat-chips"></nav>
        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="shop-filters" data-i18n="filter_title">คัดกรอง</button>
        <div class="shop-layout">
        <aside class="shop-filters" id="shop-filters">
            <div class="filter-head">
                <h2 data-i18n="filter_title">คัดกรอง</h2>
                <button type="button" class="filter-clear" id="filter-clear" data-i18n="filter_clear">ล้างตัวกรอง</button>
            </div>
            <div class="filter-group">
                <h3 data-i18n="filter_vehicle">ประเภทรถ</h3>
                <div id="vehicle-options"></div>
            </div>
            <div class="filter-group">
                <h3 data-i18n="filter_price">ช่วงราคา (บาท)</h3>
                <div class="price-range">
                    <input type="number" id="price-min" min="0" inputmode="numeric" data-i18n-placeholder="price_min" placeholder="ต่ำสุด">
                    <span>–</span>
                    <input type="number" id="price-max" min="0" inputmode="numeric" data-i18n-placeholder="price_max" placeholder="สูงสุด">
                </div>
            </div>
        </aside>
        <div class="shop-main">
        <div class="shop-toolbar">
            <div class="shop-search">
                <input type="search" id="shop-search" data-i18n-placeholder="search_placeholder_generic" placeholder="ค้นหาชื่อสินค้า หรือไซส์...">
            </div>
            <select id="shop-sort" class="shop-sort">
                <option value="newest" data-i18n="sort_newest">ใหม่ล่าสุด</option>
                <option value="name_asc" data-i18n="sort_name_asc">ชื่อ: ก-ฮ / A-Z</option>
                <option value="name_desc" data-i18n="sort_name_desc">ชื่อ: ฮ-ก / Z-A</option>
                <option value="price_asc" data-i18n="sort_price_asc">ราคา: ถูก → แพง</option>
                <option value="price_desc" data-i18n="sort_price_desc">ราคา: แพง → ถูก</option>
                <option value="size_asc" data-i18n="sort_size_asc">ไซส์: เล็ก → ใหญ่</option>
                <option value="size_desc" data-i18n="sort_size_desc">ไซส์: ใหญ่ → เล็ก</option>
            </select>
            <span class="shop-count" id="shop-count"></span>
        </div>
        <div class="products-grid" id="products-grid"></div>
        </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/products.js"></script>
    <script>
        // sidebar filters: vehicle type (products.vehicle_type) + price range
        const VEHICLE_TYPES = [
            { value: '', key: 'vehicle_all' },
            { value: 'pickup', key: 'vehicle_pickup' },
            { value: 'sedan', key: 'vehicle_sedan' },
        ];
        let vehicle = '';
        let shockProducts = [];
        let page;
        const priceMin = document.getElementById('price-min');
        const priceMax = document.getElementById('price-max');

        function shockFilter(p) {
            if (vehicle && p.vehicle_type !== vehicle) return false;
            const min = priceMin.value === '' ? null : Number(priceMin.value);
            const max = priceMax.value === '' ? null : Number(priceMax.value);
            if (min === null && max === null) return true;
            if (p.price == null) return false; // "ask for price" items can't match a price range
            return (min === null || p.price >= min) && (max === null || p.price <= max);
        }

        function renderVehicleOptions() {
            document.getElementById('vehicle-options').innerHTML = VEHICLE_TYPES.map(v => {
                const count = v.value ? shockProducts.filter(p => p.vehicle_type === v.value).length : shockProducts.length;
                return `<label class="filter-option">
                    <input type="radio" name="vehicle" value="${v.value}" ${v.value === vehicle ? 'checked' : ''}>
                    <span>${t(v.key)}</span><span class="filter-count">${count}</span>
                </label>`;
            }).join('');
        }

        document.getElementById('vehicle-options').addEventListener('change', e => {
            vehicle = e.target.value;
            page.render();
        });
        priceMin.addEventListener('input', () => page.render());
        priceMax.addEventListener('input', () => page.render());
        document.getElementById('filter-clear').onclick = () => {
            vehicle = '';
            priceMin.value = '';
            priceMax.value = '';
            renderVehicleOptions();
            page.render();
        };
        // phones: the sidebar is hidden behind the "filter" button
        const filterToggle = document.getElementById('filter-toggle');
        filterToggle.onclick = () => {
            const open = document.getElementById('shop-filters').classList.toggle('open');
            filterToggle.setAttribute('aria-expanded', open);
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderVehicleOptions();
            page = initProductPage('shock', 'newest', {
                filter: shockFilter,
                onLoad: products => { shockProducts = products; renderVehicleOptions(); },
                onLanguageChange: renderVehicleOptions,
            });
        });
    </script>
</body>
</html>
