<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โช้คอัพ (Shock Absorbers) - BoyAutoTires</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/staff.css">
    <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="shock">
    <div id="site-header"></div>

    <section class="page-hero">
        <div class="container">
            <div class="breadcrumb"><a href="/" data-i18n="nav_home">หน้าแรก</a> / <span data-i18n="nav_shock"></span></div>
            <h1 class="page-title" data-i18n="page_title_shock">Loading...</h1>
            <p class="page-sub" data-i18n="cat_shock_desc"></p>
        </div>
    </section>

    <main class="container shop">
        <nav class="cat-chips" id="cat-chips"></nav>
        <button type="button" class="filter-toggle" id="filter-toggle" aria-expanded="false" aria-controls="shop-filters" data-i18n="filter_title">คัดกรอง</button>
        <div class="shop-layout">
        <aside class="shop-filters" id="shop-filters">
            <div class="filter-head">
                <h2 data-i18n="filter_title">คัดกรอง</h2>
                <button type="button" class="filter-clear" id="filter-clear" data-i18n="filter_clear">ล้างตัวกรอง</button>
            </div>
            <div class="filter-group">
                <h3 data-i18n="filter_vehicle">ประเภทรถ</h3>
                <div id="filter-options"></div>
            </div>
            <div class="filter-group">
                <h3 data-i18n="filter_price">ช่วงราคา (บาท)</h3>
                <div class="price-range">
                    <input type="number" id="price-min" min="0" inputmode="numeric" data-i18n-placeholder="price_min" placeholder="ต่ำสุด">
                    <span>–</span>
                    <input type="number" id="price-max" min="0" inputmode="numeric" data-i18n-placeholder="price_max" placeholder="สูงสุด">
                </div>
            </div>
        </aside>
        <div class="shop-main">
        <div class="shop-toolbar">
            <div class="shop-search">
                <input type="search" id="shop-search" data-i18n-placeholder="search_placeholder_generic" placeholder="ค้นหาชื่อสินค้า หรือไซส์...">
            </div>
            <span class="shop-count" id="shop-count"></span>
        </div>
        <div class="products-grid" id="products-grid"></div>
        </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/search.js"></script>
    <script src="js/products.js"></script>
    <script>
        // sidebar: vehicle type (products.vehicle_type) + price range (js/products.js)
        const VEHICLE_TYPES = [
            { value: 'pickup', key: 'vehicle_pickup' },
            { value: 'sedan', key: 'vehicle_sedan' },
        ];
        document.addEventListener('DOMContentLoaded', () => initFilteredProductPage('shock', 'newest', {
            getOptions: products => VEHICLE_TYPES.map(v => ({
                value: v.value,
                label: t(v.key),
                count: products.filter(p => p.vehicle_type === v.value).length,
            })),
            matches: (p, value) => p.vehicle_type === value,
        }));
    </script>
</body>
</html>
