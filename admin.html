<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบหลังร้าน - BoyAutoTires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
    [hidden] { display: none !important; }
    body { min-height: 100vh; }
    .muted { color: var(--muted); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------------- Buttons & fields (same look as the public site) ---------------- */
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        padding: 11px 22px;
        border-radius: 999px;
        border: 1px solid transparent;
        font: inherit; font-weight: 700; font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        transition: transform .2s, box-shadow .2s, background .2s;
    }
    .btn:disabled { opacity: .6; cursor: wait; transform: none; box-shadow: none; }
    .btn-gold { background: var(--gold); color: #111; }
    .btn-gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 197, 24, 0.3); }
    .btn-outline { background: transparent; border-color: var(--line); color: var(--text); }
    .btn-outline:hover { background: rgba(77, 163, 255, 0.1); }
    .btn-block { width: 100%; }

    .field-label { display: block; font-size: 14px; font-weight: 600; margin: 18px 0 6px; }
    .field-label .req { color: var(--gold); }
    .field-hint { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
    .field {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(77, 163, 255, 0.25);
        background: #070d1c;
        color: var(--text);
        font: inherit; font-size: 15px;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    .field:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15); }
    .field::placeholder { color: #5f7396; }
    textarea.field { resize: vertical; min-height: 90px; }
    .error-msg { color: #ff7a7a; font-size: 14px; min-height: 20px; margin-top: 10px; }

    /* ---------------- Header ---------------- */
    .admin-header {
        position: sticky; top: 0; z-index: 900;
        background: rgba(5, 8, 16, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
    }
    .admin-header .container { display: flex; align-items: center; gap: 12px; min-height: 64px; flex-wrap: wrap; }
    .admin-header .logo { font-size: 22px; }
    .admin-badge {
        font-size: 12px; font-weight: 700;
        color: var(--gold);
        border: 1px solid rgba(245, 197, 24, 0.4);
        padding: 3px 10px; border-radius: 999px;
        white-space: nowrap;
    }
    .admin-header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .hdr-link {
        display: inline-flex; align-items: center;
        color: var(--muted); text-decoration: none;
        font-size: 13px; font-weight: 600;
        padding: 6px 12px; border-radius: 999px;
        border: 1px solid var(--line);
        white-space: nowrap;
    }
    .hdr-link:hover { color: var(--gold); border-color: rgba(245, 197, 24, 0.4); }
    .lang-switch { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .lang-btn { border: none; background: transparent; color: var(--muted); padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .lang-btn.active { background: var(--gold); color: #111; }
    @media (max-width: 560px) {
        .admin-badge { display: none; }
        .hdr-link { padding: 6px 10px; font-size: 12px; }
    }

    /* ---------------- Login ---------------- */
    .login-wrap { display: flex; justify-content: center; padding: 56px 16px; }
    .login-card {
        width: 100%; max-width: 420px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .login-card h1 { margin: 0 0 6px; font-size: 26px; }
    .login-card p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
    .login-card .btn { margin-top: 24px; }
    .password-field { position: relative; }
    .password-field .field { padding-right: 48px; }
    .password-toggle {
        position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
        width: 38px; height: 38px;
        border: none; border-radius: 8px;
        background: transparent; color: var(--muted);
        font-size: 17px; cursor: pointer;
    }
    .password-toggle:hover { background: rgba(77, 163, 255, 0.12); }

    /* ---------------- Dashboard ---------------- */
    .dash { padding-top: 28px; padding-bottom: 60px; }
    .dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .dash-head h1 { margin: 0; font-size: clamp(24px, 4vw, 32px); }
    .dash-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 560px; }

    .cat-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
    .cat-tab {
        display: flex; align-items: center; gap: 10px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        font: inherit; font-weight: 600; font-size: 15px;
        text-align: left;
        cursor: pointer;
        transition: border-color .2s, background .2s;
    }
    .cat-tab:hover { border-color: rgba(245, 197, 24, 0.4); }
    .cat-tab.active { border-color: var(--gold); background: rgba(245, 197, 24, 0.08); color: var(--gold); }
    .cat-tab .icon { font-size: 22px; }
    .cat-tab .count {
        margin-left: auto;
        font-size: 12px; font-weight: 700;
        background: rgba(255, 255, 255, 0.08); color: var(--text);
        padding: 2px 9px; border-radius: 999px;
    }
    .cat-tab.active .count { background: var(--gold); color: #111; }
    @media (max-width: 760px) { .cat-tabs { grid-template-columns: repeat(2, 1fr); } }

    /* shop open/closed switch */
    .store-panel {
        display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
        padding: 14px 16px; margin-bottom: 18px;
        border-radius: 14px; border: 1px solid var(--line); background: var(--panel);
    }
    .store-panel h2 { margin: 0; font-size: 16px; }
    .store-modes { display: flex; flex-wrap: wrap; gap: 8px; }
    .store-mode {
        padding: 8px 14px; border-radius: 999px;
        border: 1px solid var(--line); background: transparent; color: var(--text);
        font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
        transition: border-color .2s, background .2s;
    }
    .store-mode:hover { border-color: rgba(245, 197, 24, 0.4); }
    .store-mode.active { border-color: var(--gold); background: rgba(245, 197, 24, 0.12); color: var(--gold); }
    .store-mode:disabled { opacity: .6; cursor: wait; }
    .store-now { font-size: 14px; color: var(--muted); }
    .store-now b.open { color: #2ee07a; }
    .store-now b.closed { color: #ff7a7a; }

    /* drag to reorder photos (SortableJS) */
    .image-thumb { cursor: grab; touch-action: manipulation; }
    .image-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-thumb.sortable-chosen { transform: scale(1.06); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
    .image-thumb.sortable-ghost { opacity: .35; }
    .pf-type-tag {
        position: absolute; left: 5px; top: 5px;
        background: rgba(0, 0, 0, 0.75); color: #fff;
        font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 8px;
    }
    .drag-hint { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .drag-hint:empty { display: none; }

    .list-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .list-toolbar .field { max-width: 420px; border-radius: 999px; padding: 10px 18px; }
    .list-toolbar .muted { font-size: 14px; white-space: nowrap; }

    .status-msg { text-align: center; color: var(--muted); padding: 40px 0; }
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-row {
        display: grid;
        grid-template-columns: 64px 1fr auto auto;
        align-items: center;
        gap: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 16px;
    }
    .product-row.out .thumb, .product-row.out .info { opacity: .5; }
    .thumb {
        position: relative;
        width: 64px; height: 64px;
        border-radius: 10px; overflow: hidden;
        background: #070d1c;
        display: flex; align-items: center; justify-content: center;
        color: var(--muted); font-size: 11px; text-align: center;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .img-count {
        position: absolute; right: 3px; bottom: 3px;
        background: rgba(0, 0, 0, 0.75); color: #fff;
        font-size: 10px; padding: 1px 6px; border-radius: 8px;
    }
    .info { min-width: 0; }
    .info h4 { margin: 0 0 4px; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
    .size-badge {
        background: rgba(77, 163, 255, 0.12);
        border: 1px solid rgba(77, 163, 255, 0.35);
        color: #9fc3ff;
        font-size: 12px; font-weight: 700;
        padding: 1px 9px; border-radius: 999px;
    }
    .price { color: var(--gold); font-weight: 700; }

    /* on/off switch */
    .switch-label { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-size: 14px; font-weight: 600; }
    .switch-label input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .switch {
        position: relative; flex-shrink: 0;
        width: 44px; height: 24px;
        border-radius: 999px;
        background: #3a4560;
        transition: background .2s;
    }
    .switch::after {
        content: ''; position: absolute; top: 3px; left: 3px;
        width: 18px; height: 18px; border-radius: 50%;
        background: #fff; transition: transform .2s;
    }
    .switch-label input:checked + .switch { background: #22b35a; }
    .switch-label input:checked + .switch::after { transform: translateX(20px); }
    .switch-label input:focus-visible + .switch { outline: 2px solid var(--gold); outline-offset: 2px; }
    .switch-label input:disabled + .switch { opacity: .5; }
    .stock-text { min-width: 64px; }
    .stock-text.on { color: #4ade80; }
    .stock-text.off { color: #ff7a7a; }

    .row-actions { display: flex; gap: 8px; }
    .btn-sm {
        border: 1px solid var(--line);
        background: transparent; color: var(--text);
        font: inherit; font-size: 13px; font-weight: 600;
        padding: 7px 14px; border-radius: 999px;
        cursor: pointer; white-space: nowrap;
    }
    .btn-sm:hover { border-color: var(--gold); color: var(--gold); }
    .btn-sm.danger:hover { border-color: #ff7a7a; color: #ff7a7a; }

    @media (max-width: 700px) {
        .product-row { grid-template-columns: 64px 1fr; gap: 10px 14px; }
        .product-row .switch-label { grid-column: 1 / -1; }
        .product-row .row-actions { grid-column: 1 / -1; }
        .product-row .row-actions .btn-sm { flex: 1; padding: 10px; }
        .list-toolbar .field { max-width: none; }
    }

    /* ---------------- Add / edit drawer ---------------- */
    .drawer-backdrop {
        position: fixed; inset: 0; z-index: 1500;
        background: rgba(0, 0, 0, 0.6);
        display: flex; justify-content: flex-end;
    }
    .drawer {
        width: 100%; max-width: 520px; height: 100%;
        background: var(--bg-2);
        border-left: 1px solid var(--line);
        display: flex; flex-direction: column;
        animation: slideIn .2s ease-out;
    }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 4px 0 0; font-size: 22px; }
    .drawer-cat { font-size: 13px; font-weight: 700; color: var(--gold); }
    .drawer-close {
        margin-left: auto;
        width: 40px; height: 40px; flex-shrink: 0;
        border: 1px solid var(--line); border-radius: 50%;
        background: transparent; color: var(--text);
        font-size: 22px; line-height: 1; cursor: pointer;
    }
    .drawer-close:hover { border-color: var(--gold); color: var(--gold); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 4px 24px 24px; }
    .drawer-foot { padding: 14px 24px 20px; border-top: 1px solid var(--line); }
    .drawer-foot .error-msg { margin: 0 0 10px; min-height: 0; }
    .drawer-foot .btns { display: flex; gap: 10px; }
    .drawer-foot .btns .btn { flex: 1; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    @media (max-width: 480px) {
        .field-row { grid-template-columns: 1fr; }
        .drawer-head, .drawer-body, .drawer-foot { padding-left: 16px; padding-right: 16px; }
    }

    .stock-box {
        margin-top: 20px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #070d1c;
    }

    /* image picker */
    .dropzone {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        padding: 22px 16px;
        border: 2px dashed rgba(77, 163, 255, 0.35);
        border-radius: 14px;
        background: #070d1c;
        text-align: center;
        cursor: pointer;
        transition: border-color .2s, background .2s;
    }
    .dropzone:hover, .dropzone.drag { border-color: var(--gold); background: rgba(245, 197, 24, 0.06); }
    .dropzone .dz-icon { font-size: 28px; }
    .dropzone .dz-text { font-weight: 600; }
    .dropzone small { color: var(--muted); font-size: 12px; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 12px; }
    .image-grid:empty { display: none; }
    .image-thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: #070d1c; }
    .image-thumb.cover { border-color: var(--gold); }
    .image-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-thumb .remove-img {
        position: absolute; top: 5px; right: 5px;
        width: 26px; height: 26px; padding: 0;
        border: none; border-radius: 50%;
        background: rgba(0, 0, 0, 0.75); color: #fff;
        font-size: 16px; line-height: 26px; cursor: pointer;
    }
    .image-thumb .remove-img:hover { background: #d33; }
    .image-thumb .cover-tag {
        position: absolute; left: 0; right: 0; bottom: 0;
        font-size: 11px; font-weight: 700;
        text-align: center; padding: 4px 0;
        background: var(--gold); color: #111;
    }
    #upload-status { font-size: 13px; color: var(--muted); margin-top: 8px; }

    /* ---------------- Toast ---------------- */
    .toast {
        position: fixed; left: 50%; bottom: 24px; z-index: 2000;
        transform: translate(-50%, 20px);
        background: #16a34a; color: #fff;
        font-weight: 600; font-size: 15px;
        padding: 12px 22px; border-radius: 999px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        opacity: 0; pointer-events: none;
        transition: opacity .25s, transform .25s;
        max-width: calc(100% - 32px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: #c53030; }
</style>
</head>
<body>

<header class="admin-header">
    <div class="container">
        <a href="/" class="logo"><span class="b">B</span>oyAuto<span class="t">Tires</span></a>
        <span class="admin-badge" data-i18n="admin_badge">ระบบหลังร้าน</span>
        <div class="admin-header-right">
            <div class="lang-switch">
                <button class="lang-btn" data-lang="th" onclick="setLanguage('th')">ไทย</button>
                <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
            </div>
            <a href="/" target="_blank" rel="noopener" class="hdr-link" data-i18n="admin_view_site">ดูหน้าเว็บ ↗</a>
            <a id="staff-logout-link" href="#" class="hdr-link" style="display:none;" data-i18n="staff_logout" onclick="staffLogout(); return false;">ออกจากระบบ</a>
        </div>
    </div>
</header>

<!-- ===================== LOGIN ===================== -->
<main class="login-wrap" id="login-view" hidden>
    <form class="login-card" onsubmit="handleLogin(event)">
        <h1 data-i18n="login_title">เข้าสู่ระบบพนักงาน</h1>
        <p data-i18n="login_sub">สำหรับเพิ่ม แก้ไข และลบสินค้าบนหน้าเว็บ</p>
        <label class="field-label" for="login-email" data-i18n="field_email">อีเมล</label>
        <input class="field" type="email" id="login-email" autocomplete="username">
        <label class="field-label" for="login-password" data-i18n="field_password">รหัสผ่าน</label>
        <div class="password-field">
            <input class="field" type="password" id="login-password" autocomplete="current-password" data-i18n-placeholder="placeholder_password">
            <button type="button" class="password-toggle" id="password-toggle" onclick="togglePassword()">👁</button>
        </div>
        <button type="submit" class="btn btn-gold btn-block" id="login-btn" data-i18n="btn_login">เข้าสู่ระบบ</button>
        <div class="error-msg" id="login-error"></div>
    </form>
</main>

<!-- ===================== DASHBOARD ===================== -->
<main class="container dash" id="dashboard" hidden>
    <div class="dash-head">
        <div>
            <h1 data-i18n="dash_title">จัดการสินค้า</h1>
            <p data-i18n="dash_sub"></p>
        </div>
        <button type="button" class="btn btn-gold" id="add-product-btn" onclick="currentCategory === 'portfolio' ? openPortfolioForm() : openAddForm()" data-i18n="btn_add">＋ เพิ่มสินค้า</button>
    </div>

    <div class="store-panel">
        <h2 data-i18n="store_panel_title">สถานะร้านวันนี้</h2>
        <div class="store-modes" id="store-modes"></div>
        <span class="store-now" id="store-now"></span>
    </div>

    <div class="cat-tabs" id="cat-tabs"></div>

    <div id="products-view">
        <div class="list-toolbar">
            <input type="search" class="field" id="list-search" data-i18n-placeholder="list_search" oninput="renderList()">
            <span class="muted" id="list-count"></span>
        </div>

        <div class="status-msg" id="list-status"></div>
        <div class="product-list" id="product-list"></div>
    </div>

    <!-- portfolio photos/videos shown on /portfolio -->
    <section id="portfolio-view" hidden>
        <div class="list-toolbar">
            <input type="search" class="field" id="pf-admin-search" data-i18n-placeholder="pf_search" oninput="renderPortfolioAdmin()">
            <span class="muted" id="pf-count"></span>
        </div>
        <div class="status-msg" id="pf-status" hidden></div>
        <div class="product-list" id="pf-list"></div>
    </section>
</main>

<!-- ===================== ADD / EDIT DRAWER ===================== -->
<div class="drawer-backdrop" id="drawer" hidden>
    <form class="drawer" onsubmit="saveProduct(event)" novalidate>
        <div class="drawer-head">
            <div>
                <div class="drawer-cat" id="form-cat"></div>
                <h2 id="form-title"></h2>
            </div>
            <button type="button" class="drawer-close" id="drawer-close" onclick="closeForm()">×</button>
        </div>

        <div class="drawer-body">
            <input type="hidden" id="edit-id">

            <label class="field-label" for="f-name"><span id="f-name-label" data-i18n="field_name">ชื่อสินค้า</span> <span class="req">*</span></label>
            <input class="field" type="text" id="f-name" data-i18n-placeholder="placeholder_name">
            <span class="field-hint" id="wheel-text-hint" data-i18n="wheel_text_hint" hidden></span>

            <div class="field-row">
                <div>
                    <label class="field-label" for="f-size" data-i18n="field_size">ไซส์</label>
                    <input class="field" type="text" id="f-size">
                </div>
                <div>
                    <label class="field-label" for="f-price" data-i18n="field_price">ราคา (บาท)</label>
                    <input class="field" type="number" id="f-price" min="0" inputmode="numeric" data-i18n-placeholder="price_placeholder">
                </div>
            </div>

            <div id="model-field">
                <div class="field-row">
                    <div>
                        <label class="field-label" for="f-series" data-i18n="field_series">ซีรีส์</label>
                        <input class="field" type="text" id="f-series" data-i18n-placeholder="placeholder_series">
                    </div>
                    <div>
                        <label class="field-label" for="f-model" data-i18n="field_model">Model</label>
                        <input class="field" type="text" id="f-model" data-i18n-placeholder="placeholder_model">
                    </div>
                </div>
                <label class="field-label" for="f-color" data-i18n="field_color">สีล้อ</label>
                <input class="field" type="text" id="f-color" data-i18n-placeholder="placeholder_color">
                <span class="field-hint" data-i18n="wheel_text_hint"></span>
            </div>

            <div id="vehicle-field">
                <label class="field-label" for="f-vehicle" data-i18n="field_vehicle">ประเภทรถ</label>
                <select class="field" id="f-vehicle">
                    <option value="" data-i18n="vehicle_none">— ไม่ระบุ —</option>
                    <option value="pickup" data-i18n="vehicle_pickup">รถกระบะ / SUV / รถตู้</option>
                    <option value="sedan" data-i18n="vehicle_sedan">รถเก๋ง</option>
                </select>
            </div>

            <label class="field-label" for="f-desc" data-i18n="field_desc">รายละเอียด</label>
            <textarea class="field" id="f-desc" data-i18n-placeholder="placeholder_desc"></textarea>

            <span class="field-label" data-i18n="field_image">รูปภาพสินค้า</span>
            <label class="dropzone" id="dropzone">
                <input type="file" id="f-image-file" class="visually-hidden" accept="image/*" multiple onchange="addImages(this.files); this.value='';">
                <span class="dz-icon">📷</span>
                <span class="dz-text" data-i18n="dz_text">กดเพื่อเลือกรูป หรือลากรูปมาวางตรงนี้</span>
                <small data-i18n="dz_hint">เลือกได้หลายรูป · รูปที่มีกรอบสีทองคือรูปหลักที่ลูกค้าเห็นก่อน</small>
            </label>
            <div class="image-grid" id="image-grid"></div>
            <span class="drag-hint" id="image-drag-hint"></span>
            <div id="upload-status"></div>

            <div class="stock-box">
                <label class="switch-label">
                    <input type="checkbox" id="f-instock" checked>
                    <span class="switch"></span>
                    <span data-i18n="field_instock">มีสินค้าพร้อมขาย</span>
                </label>
                <span class="field-hint" data-i18n="field_instock_hint"></span>
            </div>
        </div>

        <div class="drawer-foot">
            <div class="error-msg" id="form-error"></div>
            <div class="btns">
                <button type="button" class="btn btn-outline" onclick="closeForm()" data-i18n="btn_cancel">ยกเลิก</button>
                <button type="submit" class="btn btn-gold" id="save-btn" data-i18n="btn_save">บันทึก</button>

</div>

<!-- ===================== PORTFOLIO DRAWER ===================== -->
<div class="drawer-backdrop" id="pf-drawer" hidden>
    <form class="drawer" onsubmit="savePortfolio(event)" novalidate>
        <div class="drawer-head">
            <div>
                <div class="drawer-cat">🏆 <span data-i18n="tab_portfolio">ผลงาน</span></div>
                <h2 id="pf-form-title"></h2>
            </div>
            <button type="button" class="drawer-close" onclick="closePortfolioForm()" aria-label="Close">×</button>
        </div>

        <div class="drawer-body">
            <label class="field-label" for="pf-car"><span data-i18n="pf_field_car">ชื่อรถ</span> <span class="req">*</span></label>
            <input class="field" type="text" id="pf-car" autocomplete="off" data-i18n-placeholder="pf_car_ph">

            <span class="field-label" data-i18n="pf_field_files">รูปภาพ / วิดีโอ</span>
            <label class="dropzone" id="pf-dropzone">
                <input type="file" id="pf-file" class="visually-hidden" accept="image/*,video/*" multiple onchange="addPortfolioFiles(this.files); this.value='';">
                <span class="dz-icon">📷 🎬</span>
                <span class="dz-text" data-i18n="pf_dz_text">กดเพื่อเลือกรูปหรือวิดีโอ หรือลากมาวางตรงนี้</span>
                <small data-i18n="pf_dz_hint">เลือกได้หลายไฟล์ · ไฟล์ละไม่เกิน 50 MB</small>
            </label>
            <div class="image-grid" id="pf-grid-edit"></div>
            <span class="drag-hint" id="pf-drag-hint"></span>
            <div id="pf-upload-status"></div>
        </div>

        <div class="drawer-foot">
            <div class="error-msg" id="pf-form-error"></div>
            <div class="btns">
                <button type="button" class="btn btn-outline" onclick="closePortfolioForm()" data-i18n="btn_cancel">ยกเลิก</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store-status.js"></script>
<script src="js/search.js"></script>
<script src="js/portfolio.js"></script>
<script>
    const CATEGORIES = [
        { cat: 'tires',  key: 'tab_tires',  icon: '🛞' },
        { cat: 'wheels', key: 'tab_wheels', icon: '⚙️' },
        { cat: 'shock',  key: 'tab_shock',  icon: '🔩' },
        { cat: 'brake',  key: 'tab_brake',  icon: '🛑' },
    ];
    const IMAGE_BUCKET = 'product-images';

    let currentCategory = 'tires';
    let products = [];        // every product, all categories
    // Images in the form, in display order. Each item is either
    // { url } (already in Storage) or { file, preview } (not uploaded yet).
    let formImages = [];

    function escHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
    }

    // wheels: "Series · Model" (same as js/products.js)
    function wheelLine(p) {
        return [p.series, p.model].filter(Boolean).join(' · ');
    }

    // older rows only have image_url; newer rows have image_urls
    function getProductImages(p) {
        if (p.image_urls && p.image_urls.length) return p.image_urls;
        return p.image_url ? [p.image_url] : [];
    }

    function categoryInfo(cat) {
        return CATEGORIES.find(c => c.cat === cat);
    }

    // ---- Toast ----
    let toastTimer;
    function showToast(msg, type) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast show' + (type === 'error' ? ' error' : '');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), type === 'error' ? 5000 : 2500);
    }

    // ---- Show / hide password ----
    function togglePassword() {
        const input = document.getElementById('login-password');
        input.type = input.type === 'password' ? 'text' : 'password';
        updatePasswordToggleUI();
        input.focus();
    }

    function updatePasswordToggleUI() {
        const input = document.getElementById('login-password');
        const btn = document.getElementById('password-toggle');
        const hidden = input.type === 'password';
        btn.textContent = hidden ? '👁' : '🙈';
        btn.title = t(hidden ? 'pw_show' : 'pw_hide');
        btn.setAttribute('aria-label', btn.title);
    }

    // ---- Auth gate ----
    async function checkAccess() {
        const isLoggedIn = await initAuthUI();
        document.getElementById('login-view').hidden = isLoggedIn;
        document.getElementById('dashboard').hidden = !isLoggedIn;
        if (isLoggedIn) {
            refreshList();
            refreshPortfolio();
            loadStoreSwitch();
        }
        else document.getElementById('login-email').focus();
    }

    // ---- Shop open/closed switch (js/store-status.js) ----
    let storeSetting = null;

    async function loadStoreSwitch() {
        storeSetting = await fetchStoreSetting();
        renderStoreSwitch();
    }

    function renderStoreSwitch() {
        const status = getStoreStatus(storeSetting);
        // a forced mode from an earlier day has expired, so it shows as auto
        const mode = status.manual ? storeSetting.mode : 'auto';
        document.getElementById('store-modes').innerHTML = ['auto', 'open', 'closed'].map(m =>
            `<button type="button" class="store-mode ${m === mode ? 'active' : ''}" onclick="setStoreMode('${m}')">${t('store_mode_' + m)}</button>`
        ).join('');
        const note = status.manual ? t('store_manual_note') : `${t('store_by_hours')} ${storeHoursText()}`;
        document.getElementById('store-now').innerHTML =
            `${t('store_now_label')} <b class="${status.open ? 'open' : 'closed'}">${t(status.open ? 'store_open_now' : 'store_closed_now')}</b> (${escHtml(note)})`;
    }

    async function setStoreMode(mode) {
        document.querySelectorAll('.store-mode').forEach(b => b.disabled = true);
        const { error } = await saveStoreMode(mode);
        if (error) {
            console.error(error);
            showToast(t('store_save_error') + error.message, 'error');
        } else {
            showToast(t('toast_store_saved'));
        }
        await loadStoreSwitch();
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error');
        const btn = document.getElementById('login-btn');
        errEl.textContent = '';

        if (!email || !password) {
            errEl.textContent = t('login_error_empty');
            return;
        }

        btn.disabled = true;
        btn.textContent = t('login_loading');
        const { error } = await sb.auth.signInWithPassword({ email, password });
        btn.disabled = false;
        btn.textContent = t('btn_login');

        if (error) {
            errEl.textContent = t('login_error_failed');
            return;
        }
        checkAccess();
    }

    // ---- Category tabs ----
    function renderTabs() {
        const tabs = [
            ...CATEGORIES.map(c => ({ ...c, count: products.filter(p => p.category === c.cat).length })),
            { cat: 'portfolio', key: 'tab_portfolio', icon: '🏆', count: groupPortfolio(portfolioItems).length },
        ];
        document.getElementById('cat-tabs').innerHTML = tabs.map(c => `
                <button type="button" class="cat-tab ${c.cat === currentCategory ? 'active' : ''}" onclick="switchTab('${c.cat}')">
                    <span class="icon">${c.icon}</span>
                    <span>${t(c.key)}</span>
                    <span class="count">${c.count}</span>
                </button>`).join('');
    }

    function switchTab(cat) {
        currentCategory = cat;
        const isPortfolio = cat === 'portfolio';
        document.getElementById('products-view').hidden = isPortfolio;
        document.getElementById('portfolio-view').hidden = !isPortfolio;
        const addBtn = document.getElementById('add-product-btn');
        addBtn.setAttribute('data-i18n', isPortfolio ? 'pf_add_title' : 'btn_add');
        addBtn.textContent = t(addBtn.getAttribute('data-i18n'));
        document.getElementById('list-search').value = '';
        renderTabs();
        if (isPortfolio) renderPortfolioAdmin();
        else renderList();
    }

    // ---- Portfolio (ผลงาน): one row per car, edited in a drawer like products ----
    const PORTFOLIO_BUCKET = 'portfolio';
    const PORTFOLIO_MAX_BYTES = 50 * 1024 * 1024; // bucket limit (supabase-add-portfolio.sql)
    let portfolioItems = [];
    let pfEditKey = null;   // album being edited, null when adding
    let pfFormItems = [];   // in display order: { id, url, type } saved, or { file, preview, type } new

    async function refreshPortfolio() {
        const { data, error } = await sb
            .from('portfolio_items')
            .select('*')
            .order('created_at', { ascending: false });
        const statusEl = document.getElementById('pf-status');
        if (error) {
            console.error(error);
            statusEl.textContent = t('pf_load_error');
            statusEl.hidden = false;
            return;
        }
        portfolioItems = data || [];
        renderTabs();
        renderPortfolioAdmin();
    }

    function findAlbum(key) {
        return groupPortfolio(portfolioItems).find(a => a.key === key);
    }

    function mediaThumb(url, type) {
        return type === 'video'
            ? `<video src="${escHtml(url)}#t=0.1" muted playsinline preload="metadata"></video>`
            : `<img src="${escHtml(url)}" alt="" loading="lazy">`;
    }

    function renderPortfolioAdmin() {
        const all = groupPortfolio(portfolioItems);
        const albums = all.filter(a => textMatches(a.name, document.getElementById('pf-admin-search').value));
        const statusEl = document.getElementById('pf-status');
        document.getElementById('pf-count').textContent = `${albums.length} ${t('pf_count_suffix')}`;
        statusEl.textContent = t(all.length ? 'list_no_match' : 'pf_empty_admin');
        statusEl.hidden = albums.length > 0;

        document.getElementById('pf-list').innerHTML = albums.map(a => `
            <div class="product-row">
                <div class="thumb">
                    ${mediaThumb(a.cover.url, a.cover.media_type)}
                    ${a.items.length > 1 ? `<span class="img-count">${a.items.length}</span>` : ''}
                </div>
                <div class="info">
                    <h4 title="${escHtml(a.name)}">${escHtml(a.name || t('pf_no_name'))}</h4>
                    <div class="meta">
                        ${a.photos.length ? `<span>📷 ${a.photos.length}</span>` : ''}
                        ${a.videos.length ? `<span>🎬 ${a.videos.length}</span>` : ''}
                    </div>
                </div>
                <span></span>
                <div class="row-actions">
                    <button type="button" class="btn-sm" onclick="openPortfolioForm('${a.key}')">${t('btn_edit')}</button>
                    <button type="button" class="btn-sm danger" onclick="deletePortfolioAlbum('${a.key}')">${t('btn_delete')}</button>
                </div>
            </div>`).join('');
    }

    function openPortfolioForm(key = null) {
        const album = key ? findAlbum(key) : null;
        pfEditKey = album ? album.key : null;
        pfFormItems.forEach(i => i.preview && URL.revokeObjectURL(i.preview));
        pfFormItems = album ? album.items.map(i => ({ id: i.id, url: i.url, type: i.media_type })) : [];
        document.getElementById('pf-car').value = album ? album.name : '';
        document.getElementById('pf-form-title').textContent = t(album ? 'pf_form_edit' : 'pf_add_title');
        document.getElementById('pf-form-error').textContent = '';
        document.getElementById('pf-upload-status').textContent = '';
        renderPortfolioForm();
        document.getElementById('pf-drawer').hidden = false;
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('pf-car').focus(), 50);
    }

    function closePortfolioForm() {
        document.getElementById('pf-drawer').hidden = true;
        document.body.style.overflow = '';
    }

    function renderPortfolioForm() {
        document.getElementById('pf-grid-edit').innerHTML = pfFormItems.map((item, i) => `
            <div class="image-thumb ${i === 0 ? 'cover' : ''}">
                ${mediaThumb(item.url || item.preview, item.type)}
                ${item.type === 'video' ? '<span class="pf-type-tag">🎬</span>' : ''}
                <button type="button" class="remove-img" aria-label="${t('image_remove')}" onclick="removePortfolioFormItem(${i})">×</button>
                ${i === 0 ? `<div class="cover-tag">★ ${t('image_cover')}</div>` : ''}
            </div>`).join('');
        document.getElementById('pf-drag-hint').textContent = pfFormItems.length > 1 ? dragHint() : '';
    }

    function addPortfolioFiles(files) {
        for (const file of files) {
            const type = file.type.startsWith('video/') ? 'video' : file.type.startsWith('image/') ? 'photo' : null;
            if (!type) continue;
            if (file.size > PORTFOLIO_MAX_BYTES) {
                showToast(`${t('pf_too_big')} (${file.name})`, 'error');
                continue;
            }
            pfFormItems.push({ file, type, preview: URL.createObjectURL(file) });
        }
        renderPortfolioForm();
    }

    function removePortfolioFormItem(index) {
        const [removed] = pfFormItems.splice(index, 1);
        if (removed && removed.preview) URL.revokeObjectURL(removed.preview);
        renderPortfolioForm();
    }

    // uploaded files live in the bucket; the original shop photos are site files and stay
    async function removePortfolioFiles(urls) {
        const marker = `/storage/v1/object/public/${PORTFOLIO_BUCKET}/`;
        const paths = urls
            .filter(url => url.includes(marker))
            .map(url => decodeURIComponent(url.slice(url.indexOf(marker) + marker.length)));
        if (paths.length) await sb.storage.from(PORTFOLIO_BUCKET).remove(paths);
    }

    async function savePortfolio(e) {
        e.preventDefault();
        const errEl = document.getElementById('pf-form-error');
        const statusEl = document.getElementById('pf-upload-status');
        const btn = document.getElementById('pf-save-btn');
        const car_name = document.getElementById('pf-car').value.trim();
        errEl.textContent = '';
        if (!car_name) {
            errEl.textContent = t('pf_car_required');
            document.getElementById('pf-car').focus();
            return;
        }
        if (!pfFormItems.length) {
            errEl.textContent = t('pf_files_required');
            return;
        }

        btn.disabled = true;
        btn.textContent = t('btn_saving');
        try {
            // 1. upload new files (an item keeps its url, so a retry won't upload it twice)
            const pending = pfFormItems.filter(i => i.file);
            for (const [n, item] of pending.entries()) {
                statusEl.textContent = `${t('upload_uploading')} (${n + 1}/${pending.length})`;
                const ext = item.file.name.split('.').pop();
                const path = `${item.type}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
                const { error } = await sb.storage.from(PORTFOLIO_BUCKET).upload(path, item.file);
                if (error) throw error;
                URL.revokeObjectURL(item.preview);
                item.url = sb.storage.from(PORTFOLIO_BUCKET).getPublicUrl(path).data.publicUrl;
                delete item.file;
                delete item.preview;
            }
            statusEl.textContent = '';

            // 2. files removed in the form
            const album = pfEditKey ? findAlbum(pfEditKey) : null;
            const keptIds = new Set(pfFormItems.map(i => i.id).filter(Boolean));
            const removed = album ? album.items.filter(i => !keptIds.has(i.id)) : [];
            if (removed.length) {
                const { error } = await sb.from('portfolio_items').delete().in('id', removed.map(i => i.id));
                if (error) throw error;
                await removePortfolioFiles(removed.map(i => i.url));
            }

            // 3. save name + position of every file (new ones get inserted)
            for (const [sort_order, item] of pfFormItems.entries()) {
                const { data, error } = item.id
                    ? await sb.from('portfolio_items').update({ car_name, sort_order }).eq('id', item.id).select('id')
                    : await sb.from('portfolio_items').insert({ media_type: item.type, url: item.url, car_name, sort_order }).select('id');
                if (error) throw error;
                item.id = data[0].id;
            }

            closePortfolioForm();
            showToast(t('toast_saved'));
            refreshPortfolio();
        } catch (err) {
            console.error(err);
            errEl.textContent = t('save_error') + err.message;
        } finally {
            btn.disabled = false;
            btn.textContent = t('btn_save');
        }
    }

    async function deletePortfolioAlbum(key) {
        const album = findAlbum(key);
        if (!album || !confirm(`${t('pf_confirm_delete')}\n\n${album.name || t('pf_no_name')}`)) return;
        const { error } = await sb.from('portfolio_items').delete().in('id', album.items.map(i => i.id));
        if (error) {
            showToast(t('delete_error') + error.message, 'error');
            return;
        }
        await removePortfolioFiles(album.items.map(i => i.url));
        showToast(t('toast_deleted'));
        refreshPortfolio();
    }

    // ---- List ----
    async function refreshList() {
        const statusEl = document.getElementById('list-status');
        if (!products.length) {
            statusEl.textContent = t('list_loading');
            statusEl.hidden = false;
        }

        const { data, error } = await sb
            .from('products')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            statusEl.textContent = t('list_error');
            statusEl.hidden = false;
            console.error(error);
            return;
        }

        products = data || [];
        renderTabs();
        renderList();
    }

    function renderList() {
        const listEl = document.getElementById('product-list');
        const statusEl = document.getElementById('list-status');
        const countEl = document.getElementById('list-count');
        const query = document.getElementById('list-search').value.trim().toLowerCase();

        const inCategory = products.filter(p => p.category === currentCategory);
        // js/search.js: ignores case and spaces
        const list = inCategory.filter(p => textMatches(p.name, query) || textMatches(p.size, query) || textMatches(p.model, query) || textMatches(p.series, query) || textMatches(p.color, query));

        countEl.textContent = `${list.length} ${t('list_count_suffix')}`;

        if (list.length === 0) {
            listEl.innerHTML = '';
            statusEl.textContent = inCategory.length ? t('list_no_match') : t('list_empty');
            statusEl.hidden = false;
            return;
        }

        statusEl.hidden = true;
        listEl.innerHTML = list.map(p => {
            const images = getProductImages(p);
            const hasPrice = p.price !== null && p.price !== undefined && p.price !== '';
            return `
            <div class="product-row ${p.in_stock ? '' : 'out'}">
                <div class="thumb">
                    ${images.length
                        ? `<img src="${escHtml(images[0])}" alt="" loading="lazy">
                           ${images.length > 1 ? `<span class="img-count">📷 ${images.length}</span>` : ''}`
                        : escHtml(t('no_image'))}
                </div>
                <div class="info">
                    <h4 title="${escHtml(p.name)}">${escHtml(p.name)}</h4>
                    <div class="meta">
                        ${wheelLine(p) ? `<span>${escHtml(wheelLine(p))}</span>` : ''}
                        ${p.color ? `<span>🎨 ${escHtml(p.color)}</span>` : ''}
                        ${p.size ? `<span class="size-badge">${escHtml(p.size)}</span>` : ''}
                        ${hasPrice
                            ? `<span class="price">฿${Number(p.price).toLocaleString()}</span>`
                            : `<span>${t('no_price')}</span>`}
                    </div>
                </div>
                <label class="switch-label" title="${t('stock_toggle_hint')}">
                    <input type="checkbox" ${p.in_stock ? 'checked' : ''} onchange="toggleStock('${p.id}', this)">
                    <span class="switch"></span>
                    <span class="stock-text ${p.in_stock ? 'on' : 'off'}">${p.in_stock ? t('in_stock') : t('out_of_stock')}</span>
                </label>
                <div class="row-actions">
                    <button type="button" class="btn-sm" onclick="editProduct('${p.id}')">${t('btn_edit')}</button>
                    <button type="button" class="btn-sm danger" onclick="deleteProduct('${p.id}')">${t('btn_delete')}</button>
                </div>
            </div>`;
        }).join('');
    }

    async function toggleStock(id, checkbox) {
        const p = products.find(x => x.id === id);
        const value = checkbox.checked;
        checkbox.disabled = true;

        const { error } = await sb.from('products').update({ in_stock: value }).eq('id', id);
        if (error) {
            checkbox.checked = !value;
            checkbox.disabled = false;
            showToast(t('stock_error') + error.message, 'error');
            return;
        }

        p.in_stock = value;
        renderList();
        showToast(value ? t('toast_in_stock') : t('toast_out_of_stock'));
    }

    async function deleteProduct(id) {
        const p = products.find(x => x.id === id);
        if (!confirm(`${t('confirm_delete')}\n\n${p.name}`)) return;

        const { error } = await sb.from('products').delete().eq('id', id);
        if (error) {
            showToast(t('delete_error') + error.message, 'error');
            return;
        }
        showToast(t('toast_deleted'));
        refreshList();
    }

    // ---- Add / edit drawer ----
    function fillForm(p) {
        const editing = !!p;
        document.getElementById('edit-id').value = editing ? p.id : '';
        document.getElementById('f-name').value = editing ? p.name || '' : '';
        document.getElementById('f-size').value = editing ? p.size || '' : '';
        document.getElementById('f-desc').value = editing ? p.description || '' : '';
        document.getElementById('f-price').value = editing ? p.price ?? '' : '';
        document.getElementById('f-vehicle').value = editing ? p.vehicle_type || '' : '';
        document.getElementById('f-model').value = editing ? p.model || '' : '';
        document.getElementById('f-series').value = editing ? p.series || '' : '';
        document.getElementById('f-color').value = editing ? p.color || '' : '';
        document.getElementById('f-instock').checked = editing ? !!p.in_stock : true;
        document.getElementById('upload-status').textContent = '';
        document.getElementById('form-error').textContent = '';
        formImages.forEach(img => img.preview && URL.revokeObjectURL(img.preview));
        formImages = editing ? getProductImages(p).map(url => ({ url })) : [];
        renderImageGrid();
        updateFormText();
    }

    // texts in the drawer that depend on the language / category / mode
    function updateFormText() {
        const editing = !!document.getElementById('edit-id').value;
        const c = categoryInfo(currentCategory);
        document.getElementById('form-cat').textContent = `${c.icon} ${t(c.key)}`;
        document.getElementById('form-title').textContent = t(editing ? 'form_title_edit' : 'form_title_add');
        document.getElementById('f-size').placeholder = t('size_ph_' + currentCategory);
        // vehicle type is only used by the shock page's filter
        document.getElementById('vehicle-field').hidden = currentCategory !== 'shock';
        // wheels: the product name is the brand, plus a separate Model
        const isWheels = currentCategory === 'wheels';
        document.getElementById('model-field').hidden = !isWheels;
        document.getElementById('wheel-text-hint').hidden = !isWheels;
        const nameLabel = document.getElementById('f-name-label');
        nameLabel.setAttribute('data-i18n', isWheels ? 'field_brand' : 'field_name');
        nameLabel.textContent = t(nameLabel.getAttribute('data-i18n'));
        const nameInput = document.getElementById('f-name');
        nameInput.setAttribute('data-i18n-placeholder', isWheels ? 'placeholder_brand' : 'placeholder_name');
        nameInput.placeholder = t(nameInput.getAttribute('data-i18n-placeholder'));
        document.getElementById('drawer-close').setAttribute('aria-label', t('btn_cancel'));
    }

    function openDrawer() {
        document.getElementById('drawer').hidden = false;
        document.body.style.overflow = 'hidden';
        setTimeout(() => document.getElementById('f-name').focus(), 50);
    }

    function openAddForm() {
        fillForm(null);
        openDrawer();
    }

    function editProduct(id) {
        fillForm(products.find(x => x.id === id));
        openDrawer();
    }

    function closeForm() {
        document.getElementById('drawer').hidden = true;
        document.body.style.overflow = '';
    }

    async function saveProduct(e) {
        e.preventDefault();
        const errEl = document.getElementById('form-error');
        const saveBtn = document.getElementById('save-btn');
        errEl.textContent = '';

        const id = document.getElementById('edit-id').value;
        const name = document.getElementById('f-name').value.trim();
        const size = document.getElementById('f-size').value.trim();
        const description = document.getElementById('f-desc').value.trim();
        const priceRaw = document.getElementById('f-price').value;
        const in_stock = document.getElementById('f-instock').checked;

        if (!name) {
            errEl.textContent = t('name_required');
            document.getElementById('f-name').focus();
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = t('btn_saving');

        try {
            let image_urls;
            try {
                image_urls = await uploadImages();
            } catch (uploadErr) {
                errEl.textContent = t('upload_error_retry');
                return;
            }

            const payload = {
                category: currentCategory,
                name,
                size: size || null,
                description: description || null,
                price: priceRaw ? Number(priceRaw) : null,
                image_url: image_urls[0] || null,  // cover image
                image_urls,
                in_stock
            };
            // only sent for shocks, so the other categories keep working
            // even before supabase-add-vehicle-type-column.sql has been run
            if (currentCategory === 'shock') {
                payload.vehicle_type = document.getElementById('f-vehicle').value || null;
            }
            // only sent for wheels (needs supabase-add-model-column.sql)
            if (currentCategory === 'wheels') {
                payload.model = document.getElementById('f-model').value.trim() || null;
                payload.series = document.getElementById('f-series').value.trim() || null;
                payload.color = document.getElementById('f-color').value.trim() || null;
            }

            const { error } = id
                ? await sb.from('products').update(payload).eq('id', id)
                : await sb.from('products').insert(payload);

            if (error) {
                errEl.textContent = t('save_error') + error.message;
                console.error(error);
                return;
            }

            closeForm();
            showToast(t('toast_saved'));
            refreshList();
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = t('btn_save');
        }
    }

    // ---- Image picker ----
    function addImages(files) {
        for (const file of files) {
            if (!file.type.startsWith('image/')) continue;
            formImages.push({ file, preview: URL.createObjectURL(file) });
        }
        document.getElementById('upload-status').textContent = '';
        renderImageGrid();
    }

    function removeImage(index) {
        const [removed] = formImages.splice(index, 1);
        if (removed && removed.preview) URL.revokeObjectURL(removed.preview);
        renderImageGrid();
    }

    function renderImageGrid() {
        document.getElementById('image-grid').innerHTML = formImages.map((img, i) => `
            <div class="image-thumb ${i === 0 ? 'cover' : ''}">
                <img src="${escHtml(img.url || img.preview)}" alt="">
                <button type="button" class="remove-img" title="${t('image_remove')}" aria-label="${t('image_remove')}" onclick="removeImage(${i})">×</button>
                ${i === 0 ? `<div class="cover-tag">★ ${t('image_cover')}</div>` : ''}
            </div>
        `).join('');
        document.getElementById('image-drag-hint').textContent = formImages.length > 1 ? dragHint() : '';
    }

    // how to reorder, worded for the device in hand
    function dragHint() {
        const touch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        return t(touch ? 'drag_hint' : 'drag_hint_mouse');
    }

    // press-and-hold (touch) or drag (mouse) a photo to move it; the first one is the cover
    function makeSortable(gridId, getList, render) {
        Sortable.create(document.getElementById(gridId), {
            animation: 150,
            delay: 200,
            delayOnTouchOnly: true,
            filter: '.remove-img',
            preventOnFilter: false,
            onEnd(evt) {
                if (evt.oldIndex === evt.newIndex) return;
                const list = getList();
                list.splice(evt.newIndex, 0, list.splice(evt.oldIndex, 1)[0]);
                render();
            },
        });
    }

    async function uploadImages() {
        const pending = formImages.filter(img => img.file);
        if (pending.length === 0) return formImages.map(img => img.url);

        const statusEl = document.getElementById('upload-status');
        let done = 0;

        for (const img of pending) {
            statusEl.textContent = `${t('upload_uploading')} (${done + 1}/${pending.length})`;

            const ext = img.file.name.split('.').pop();
            const path = `${currentCategory}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

            const { error: uploadError } = await sb.storage
                .from(IMAGE_BUCKET)
                .upload(path, img.file);

            if (uploadError) {
                statusEl.textContent = t('upload_error') + uploadError.message;
                throw uploadError;
            }

            const { data } = sb.storage.from(IMAGE_BUCKET).getPublicUrl(path);
            // remember the URL so a retry after a later failure doesn't re-upload this one
            URL.revokeObjectURL(img.preview);
            img.url = data.publicUrl;
            delete img.file;
            delete img.preview;
            done++;
        }

        statusEl.textContent = t('upload_success');
        return formImages.map(img => img.url);
    }

    // wheels: brand / series / model / color take only A-Z (upper case) and digits;
    // lower case is converted, anything else (Thai, symbols) is dropped
    const WHEEL_TEXT_FIELDS = ['f-name', 'f-series', 'f-model', 'f-color'];
    function toWheelText(value) {
        return value.toUpperCase().replace(/[^A-Z0-9 .\-\/]/g, '');
    }
    WHEEL_TEXT_FIELDS.forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('input', () => {
            if (currentCategory !== 'wheels') return;
            const clean = toWheelText(input.value);
            if (clean === input.value) return;
            const caret = input.selectionStart - (input.value.length - clean.length);
            input.value = clean;
            input.setSelectionRange(Math.max(caret, 0), Math.max(caret, 0));
        });
    });

    // drag & drop onto the picker
    document.addEventListener('DOMContentLoaded', () => {
        const dz = document.getElementById('dropzone');
        ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => {
            e.preventDefault();
            dz.classList.add('drag');
        }));
        ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, () => dz.classList.remove('drag')));
        dz.addEventListener('drop', e => {
            e.preventDefault();
            addImages(e.dataTransfer.files);
        });

        makeSortable('image-grid', () => formImages, renderImageGrid);
        makeSortable('pf-grid-edit', () => pfFormItems, renderPortfolioForm);

        const pfDz = document.getElementById('pf-dropzone');
        ['dragenter', 'dragover'].forEach(ev => pfDz.addEventListener(ev, e => {
            e.preventDefault();
            pfDz.classList.add('drag');
        }));
        ['dragleave', 'drop'].forEach(ev => pfDz.addEventListener(ev, () => pfDz.classList.remove('drag')));
        pfDz.addEventListener('drop', e => {
            e.preventDefault();
            addPortfolioFiles(e.dataTransfer.files);
        });
    });

    function onLanguageChange() {
        // re-render dynamic text that isn't covered by data-i18n
        updatePasswordToggleUI();
        updateFormText();
        renderImageGrid();
        renderPortfolioForm();
        if (!document.getElementById('dashboard').hidden) {
            renderTabs();
            if (currentCategory === 'portfolio') renderPortfolioAdmin();
            else renderList();
            renderStoreSwitch();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updatePasswordToggleUI();
        checkAccess();
    });
</script>

</body>
